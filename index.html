<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prognoză Meteo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=DM+Mono:wght@300;400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #07091a;
    --bg2: #0d1028;
    --bg3: #131630;
    --card: rgba(255,255,255,0.04);
    --card-hover: rgba(255,255,255,0.07);
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.14);
    --text: #e8eaf6;
    --text2: rgba(232,234,246,0.55);
    --text3: rgba(232,234,246,0.35);
    --gold: #f5c842;
    --gold2: #e8a820;
    --teal: #38d9c4;
    --teal2: #20b8a6;
    --blue: #5b9cf6;
    --rain: #7eb8f7;
    --accent: #c084fc;
    --font-display: 'Cormorant Garamond', serif;
    --font-data: 'Outfit', sans-serif;
    --font-mono: 'DM Mono', monospace;
    --r: 14px;
    --r2: 20px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-data);
    min-height: 100vh;
    overflow-x: hidden;
  }

  .noise {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    background-size: 256px;
  }

  .glow-orb {
    position: fixed; border-radius: 50%; filter: blur(120px); pointer-events: none; z-index: 0;
  }
  .glow-orb.a { width: 500px; height: 500px; top: -200px; left: -100px; background: rgba(91,156,246,0.08); }
  .glow-orb.b { width: 400px; height: 400px; bottom: 100px; right: -100px; background: rgba(56,217,196,0.06); }
  .glow-orb.c { width: 300px; height: 300px; top: 40%; left: 40%; background: rgba(245,200,66,0.05); }

  .app {
    position: relative; z-index: 1;
    max-width: 1100px; margin: 0 auto;
    padding: 40px 24px 80px;
  }

  /* ── Search Bar ── */
  .search-wrap {
    position: relative;
    margin-bottom: 32px;
    animation: fadeUp 0.5s ease both;
    isolation: isolate;
    z-index: 200;
  }
  .search-inner {
    position: relative;
    display: flex; align-items: center;
  }
  .search-icon {
    position: absolute; left: 16px;
    color: var(--text3); font-size: 16px;
    pointer-events: none; z-index: 1;
  }
  .search-input {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 50px;
    padding: 13px 100px 13px 46px;
    color: var(--text);
    font-family: var(--font-data);
    font-size: 15px;
    font-weight: 400;
    outline: none;
    transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
    letter-spacing: 0.3px;
  }
  .search-input::placeholder { color: var(--text3); }
  .search-input:focus {
    border-color: rgba(91,156,246,0.5);
    background: rgba(91,156,246,0.06);
    box-shadow: 0 0 0 3px rgba(91,156,246,0.1);
  }
  .search-clear {
    position: absolute; right: 54px;
    background: none; border: none; cursor: pointer;
    color: var(--text3); font-size: 18px; line-height: 1;
    padding: 4px; border-radius: 50%;
    transition: color 0.15s;
    display: none;
  }
  .search-clear:hover { color: var(--text); }

  .gps-btn {
    position: absolute; right: 8px;
    display: flex; align-items: center; gap: 5px;
    background: rgba(56,217,196,0.1);
    border: 1px solid rgba(56,217,196,0.3);
    border-radius: 50px;
    padding: 6px 12px;
    color: var(--teal);
    font-family: var(--font-data);
    font-size: 12px; font-weight: 500;
    cursor: pointer;
    transition: background 0.18s, border-color 0.18s, transform 0.15s;
    white-space: nowrap;
    letter-spacing: 0.3px;
  }
  .gps-btn:hover {
    background: rgba(56,217,196,0.2);
    border-color: rgba(56,217,196,0.55);
    transform: scale(1.04);
  }
  .gps-btn:active { transform: scale(0.97); }
  .gps-btn.loading {
    opacity: 0.7; pointer-events: none;
  }
  .gps-btn .gps-icon {
    font-size: 14px; line-height: 1;
    transition: transform 0.4s;
  }
  .gps-btn.loading .gps-icon {
    animation: spin 0.8s linear infinite;
  }
  @media (max-width: 400px) {
    .gps-btn span.gps-label { display: none; }
    .search-input { padding-right: 56px; }
    .search-clear { right: 50px; }
  }
  .search-suggestions {
  position: absolute;
  top: calc(100% + 8px);
  left: 0;
  right: 0;
  background: #0a0c1f;
  border: 1px solid rgba(91, 156, 246, 0.3);
  border-radius: 16px;
  overflow: hidden;
  z-index: 9999;
  box-shadow:
    0 15px 35px rgba(0,0,0,0.8),
    0 5px 15px rgba(0,0,0,0.5);
  display: none;
  animation: suggFadeIn 0.2s ease-out both;
}

.suggestion-item {
  padding: 14px 16px;
  background: #0a0c1f;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}

.suggestion-item:last-child {
  border-bottom: none;
}

.suggestion-item:hover, .suggestion-item.focused {
  background: #161b3d;
}
  @keyframes suggFadeIn {
    from { opacity: 0; transform: translateY(-6px) scale(0.99); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .search-suggestions.open { display: contents; }

  .suggestion-item {
    padding: 11px 16px;
    cursor: pointer;
    display: flex; align-items: center; gap: 12px;
    transition: background 0.12s;
    position: relative;
  }
  .suggestion-item + .suggestion-item::before {
    content: '';
    position: absolute; top: 0; left: 16px; right: 16px;
    height: 1px;
    background: rgba(255,255,255,0.07);
  }
  .suggestion-item:hover, .suggestion-item.focused {
    background: rgba(91,156,246,0.15);
  }
  .suggestion-item:hover .suggestion-pin-wrap,
  .suggestion-item.focused .suggestion-pin-wrap { background: rgba(91,156,246,0.25); }
  .suggestion-item:hover .suggestion-pin,
  .suggestion-item.focused .suggestion-pin { color: var(--blue); }

  .suggestion-pin-wrap {
    width: 32px; height: 32px; border-radius: 9px; flex-shrink: 0;
    background: rgba(255,255,255,0.05);
    display: flex; align-items: center; justify-content: center;
    transition: background 0.12s;
  }
  .suggestion-pin { color: var(--text2); font-size: 14px; line-height: 1; }

  .suggestion-text { flex: 1; min-width: 0; }
  .suggestion-name {
    font-size: 14px; font-weight: 500; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .suggestion-region {
    font-size: 11px; color: var(--text3); margin-top: 1px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .suggestion-meta {
    font-size: 11px; color: rgba(91,156,246,0.6);
    background: rgba(91,156,246,0.1);
    border: 1px solid rgba(91,156,246,0.15);
    border-radius: 20px;
    padding: 2px 9px;
    flex-shrink: 0; white-space: nowrap;
    font-family: var(--font-mono);
  }

  .search-loading {
    padding: 16px 20px; color: var(--text3); font-size: 13px;
    display: flex; align-items: center; gap: 10px;
    letter-spacing: 0.3px;
  }
  .search-loading .mini-spin {
    width: 14px; height: 14px; border: 1.5px solid rgba(91,156,246,0.2);
    border-top-color: var(--blue); border-radius: 50%;
    animation: spin 0.7s linear infinite; flex-shrink: 0;
  }
  .search-no-results {
    padding: 16px 20px; color: var(--text3); font-size: 13px;
    display: flex; align-items: center; gap: 10px;
  }
  .search-no-results::before { content: '🔍'; font-size: 15px; }

  /* ── Header ── */
  .header {
    display: flex; justify-content: space-between; align-items: flex-start;
    margin-bottom: 40px;
    animation: fadeUp 0.6s ease both;
  }
  .location-name {
    font-family: var(--font-display);
    font-size: 52px; font-weight: 300; letter-spacing: -1px;
    line-height: 1; color: var(--text);
  }
  .location-sub {
    font-size: 13px; color: var(--text2); margin-top: 6px;
    font-weight: 300; letter-spacing: 2px; text-transform: uppercase;
  }
  .now-temp { text-align: right; }
  .current-temp {
    font-family: Outfit;
    font-size: 80px; font-weight: 300; line-height: 1;
    background: linear-gradient(135deg, #f5f7ff, var(--gold));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .current-cond { font-size: 14px; color: var(--text2); text-align: right; margin-top: 4px; }
  .current-rain-remain { font-size: 13px; color: var(--rain); text-align: right; margin-top: 6px; letter-spacing: 0.2px; }
  .current-icon {font-size: 48px; line-height: 1;text-align: right; margin-bottom: 4px; filter: drop-shadow(0 0 12px rgba(255,255,255,0.2));}

  /* ── Sun arc ── */
  .sun-section {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--r2); padding: 28px 32px;
    margin-bottom: 24px;
    animation: fadeUp 0.6s 0.1s ease both;
    display: grid; grid-template-columns: 1fr auto 1fr; gap: 20px; align-items: center;
  }
  .sun-info { display: flex; flex-direction: column; }
  .sun-label { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--text3); margin-bottom: 4px; }
  .sun-time { font-family: var(--font-mono); font-size: 28px; font-weight: 300; color: var(--gold); }
  .sun-duration { font-size: 12px; color: var(--text2); margin-top: 2px; }
  .sun-arc-wrap { display: flex; justify-content: center; }
  svg.arc-svg { overflow: visible; }

  /* ── Hourly ── */
  .section-label {
    font-size: 11px; letter-spacing: 3px; text-transform: uppercase;
    color: var(--text3); margin-bottom: 12px; padding-left: 2px;
  }
  .hourly-scroll {
    display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 24px;
    scrollbar-width: thin; scrollbar-color: var(--border) transparent;
    animation: fadeUp 0.6s 0.15s ease both;
  }
  .hour-card {
    flex-shrink: 0;
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--r); padding: 12px 10px;
    text-align: center; min-width: 60px;
    transition: background 0.2s, border-color 0.2s, transform 0.15s;
    cursor: default;
  }
  .hour-card.active { background: rgba(91,156,246,0.15); border-color: rgba(91,156,246,0.4); }
  .hour-card.now { border-color: rgba(245,200,66,0.5); background: rgba(245,200,66,0.08); }
  .hour-card.now .hour-time { color: var(--gold); font-weight: 500; }
  .hour-card:hover { background: var(--card-hover); transform: translateY(-2px); }
  .hour-day-sep {
    flex-shrink: 0; align-self: center;
    color: var(--text3); font-size: 18px; line-height: 1;
    padding: 0 2px; user-select: none;
  }
  .hour-time { font-size: 11px; color: var(--text3); margin-bottom: 8px; font-family: var(--font-mono); }
  .hour-icon { font-size: 18px; margin-bottom: 6px; line-height: 1; }
  .hour-temp { font-size: 15px; font-weight: 500; }
  .hour-prec { font-size: 10px; color: var(--rain); margin-top: 4px; }

  /* ── 10-day ── */
  .days-grid {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px;
    margin-bottom: 20px;
    animation: fadeUp 0.6s 0.2s ease both;
  }
  @media (max-width: 700px) { .days-grid { grid-template-columns: repeat(2, 1fr); } }
  .day-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--r); padding: 16px 12px;
    cursor: pointer; transition: background 0.2s, border-color 0.2s, transform 0.15s;
    display: flex; flex-direction: column; gap: 6px;
  }
  .day-card:hover { background: var(--card-hover); transform: translateY(-3px); border-color: var(--border2); }
  .day-card.active { background: rgba(91,156,246,0.12); border-color: rgba(91,156,246,0.35); }
  .day-name { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text3); }
  .day-date { font-size: 11px; color: var(--text3); }
  .day-icon { font-size: 26px; line-height: 1.2; }
  .day-temps { display: flex; gap: 6px; align-items: baseline; margin-top: 2px; }
  .day-high { font-size: 18px; font-weight: 500; }
  .day-low { font-size: 13px; color: var(--text2); }
  .day-prec { font-size: 11px; color: var(--rain); }

  /* ── Total Precipitation Card ── */
  .precip-total-card {
    background: linear-gradient(135deg, rgba(126,184,247,0.08) 0%, rgba(91,156,246,0.05) 100%);
    border: 1px solid rgba(126,184,247,0.2);
    border-radius: var(--r2);
    padding: 20px 28px;
    margin-bottom: 24px;
    display: flex; align-items: center; gap: 24px;
    animation: fadeUp 0.6s 0.22s ease both;
    position: relative; overflow: hidden;
  }
  .precip-total-card::before {
    content: '';
    position: absolute; top: -30px; right: -30px;
    width: 160px; height: 160px;
    background: radial-gradient(circle, rgba(126,184,247,0.12) 0%, transparent 70%);
    pointer-events: none;
  }
  .precip-total-icon {
    font-size: 42px; line-height: 1; flex-shrink: 0;
    filter: drop-shadow(0 0 12px rgba(126,184,247,0.5));
  }
  .precip-total-info { flex: 1; }
  .precip-total-label {
    font-size: 11px; letter-spacing: 2.5px; text-transform: uppercase;
    color: rgba(126,184,247,0.6); margin-bottom: 4px;
  }
  .precip-total-value {
    font-family: var(--font-display);
    font-size: 48px; font-weight: 300; line-height: 1;
    color: #a8d4fc;
  }
  .precip-total-value span { font-size: 22px; color: rgba(168,212,252,0.6); margin-left: 4px; }
  .precip-total-sub { font-size: 12px; color: var(--text2); margin-top: 4px; }
  .precip-total-breakdown {
    display: flex; flex-direction: column; gap: 4px; flex-shrink: 0;
    align-items: flex-end;
  }
  .precip-rainy-days {
    font-size: 13px; color: var(--rain);
    display: flex; align-items: center; gap: 6px;
  }
  .precip-rainy-days strong { font-size: 22px; font-weight: 500; font-family: var(--font-mono); }
  .precip-bar-wrap {
    width: 160px; height: 6px; background: rgba(255,255,255,0.06);
    border-radius: 3px; overflow: hidden; margin-top: 6px;
  }
  .precip-bar-fill {
    height: 100%; border-radius: 3px;
    background: linear-gradient(90deg, #5b9cf6, #7eb8f7);
    transition: width 0.8s cubic-bezier(0.4,0,0.2,1);
  }
  .precip-bar-label { font-size: 10px; color: var(--text3); margin-top: 3px; }
  @media (max-width: 600px) {
    .precip-total-card { flex-wrap: wrap; gap: 16px; }
    .precip-total-breakdown { align-items: flex-start; }
    .precip-bar-wrap { width: 100%; }
  }

  /* ── Charts ── */
  .charts-row {
    display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px;
    animation: fadeUp 0.6s 0.25s ease both;
  }
  @media (max-width: 700px) { .charts-row { grid-template-columns: 1fr; } }
  .chart-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--r2); padding: 20px 20px 14px;
  }
  .chart-title {
    font-size: 12px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--text3); margin-bottom: 16px;
  }
  .chart-wrap { position: relative; width: 100%; height: 180px; }

  /* ── Wind Chart Card ── */
.wind-chart-card {
  background: linear-gradient(135deg, rgba(56,217,196,0.06) 0%, rgba(32,184,166,0.03) 100%);
  border: 1px solid rgba(56,217,196,0.2);
  border-radius: var(--r2); padding: 20px 20px 14px;
  margin-bottom: 24px;
  animation: fadeUp 0.6s 0.28s ease both;
  position: relative; overflow: hidden;
}
.wind-chart-card::before {
  content: '';
  position: absolute; top: -40px; right: -40px;
  width: 180px; height: 180px;
  background: radial-gradient(circle, rgba(56,217,196,0.08) 0%, transparent 70%);
  pointer-events: none;
}
.wind-chart-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px; flex-wrap: wrap; gap: 10px;
}
.wind-chart-subtitle {
  font-size: 10px; color: var(--text3); letter-spacing: 0.5px; margin-top: 2px;
}
.wind-now-badge {
  display: flex; align-items: center; gap: 10px;
  background: rgba(56,217,196,0.1); border: 1px solid rgba(56,217,196,0.25);
  border-radius: 12px; padding: 8px 14px;
}
.wind-compass {
  font-size: 22px; line-height: 1; color: var(--teal); display: inline-block;
  filter: drop-shadow(0 0 6px rgba(56,217,196,0.5));
  transition: transform 0.5s ease;
}
.wind-now-val {
  font-family: var(--font-mono); font-size: 22px; font-weight: 300;
  color: var(--teal); line-height: 1;
}
.wind-now-val span { font-size: 12px; color: rgba(56,217,196,0.6); margin-left: 2px; }
.wind-now-dir { font-size: 11px; color: var(--text3); margin-top: 2px;
  letter-spacing: 1px; text-transform: uppercase; }
.wind-chart-wrap { position: relative; width: 100%; height: 180px; }

  /* ── Hourly detail chart ── */
  .hourly-chart-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--r2); padding: 20px 20px 14px;
    margin-bottom: 24px;
    animation: fadeUp 0.6s 0.3s ease both;
  }
  .hourly-chart-wrap { position: relative; width: 100%; height: 160px; }

  /* ── Windy Radar Map ── */
  .windy-section {
    margin-bottom: 24px;
    animation: fadeUp 0.6s 0.35s ease both;
  }
  .windy-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--r2);
    overflow: hidden;
    position: relative;
  }
  .windy-card-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
  }
  .windy-card-title {
    font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: var(--text3);
    display: flex; align-items: center; gap: 8px;
  }
  .windy-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--teal);
    box-shadow: 0 0 8px var(--teal);
    animation: pulse-dot 2s ease infinite;
  }
  @keyframes pulse-dot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.8); }
  }
  .windy-overlay-btns {
    display: flex; gap: 6px;
  }
  .windy-layer-btn {
    padding: 5px 12px; border-radius: 20px;
    font-size: 11px; font-family: var(--font-data); letter-spacing: 0.5px;
    cursor: pointer; border: 1px solid var(--border);
    background: var(--card); color: var(--text2);
    transition: all 0.18s;
  }
  .windy-layer-btn:hover { background: var(--card-hover); color: var(--text); }
  .windy-layer-btn.active {
    background: rgba(56,217,196,0.15); border-color: rgba(56,217,196,0.4);
    color: var(--teal);
  }
  .windy-frame-wrap {
    position: relative;
    width: 100%; height: 480px;
  }
  .windy-frame-wrap iframe {
    width: 100%; height: 100%;
    border: none; display: block;
    border-radius: 0 0 var(--r2) var(--r2);
  }
  .windy-loader {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: var(--bg2); gap: 14px;
    border-radius: 0 0 var(--r2) var(--r2);
    transition: opacity 0.4s;
    pointer-events: none;
  }
  .windy-loader.hidden { opacity: 0; }
  .windy-loader .spinner { width: 32px; height: 32px; border: 2px solid var(--border); border-top-color: var(--teal); border-radius: 50%; animation: spin 0.8s linear infinite; }
  .windy-loader-text { font-size: 13px; color: var(--text2); letter-spacing: 1px; }

  .loading {
    display: flex; align-items: center; justify-content: center;
    height: 300px; flex-direction: column; gap: 16px;
  }
  .spinner { width: 36px; height: 36px; border: 2px solid var(--border); border-top-color: var(--blue); border-radius: 50%; animation: spin 0.8s linear infinite; }
  .loading-text { font-size: 13px; color: var(--text2); letter-spacing: 1px; }
  .error-msg { color: #f87171; font-size: 14px; padding: 24px; text-align: center; }

  /* ── Mobile ── */
  @media (max-width: 600px) {
    .app { padding: 20px 14px 60px; }
    .header { flex-direction: column; gap: 12px; margin-bottom: 24px; }
    .location-name { font-size: 38px; }
    .now-temp { text-align: left; display: flex; align-items: baseline; gap: 12px; }

    .current-cond { text-align: left; margin-top: 0; }
    .current-rain-remain { text-align: left; }
    .sun-section {
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto auto;
      padding: 20px 18px;
      gap: 12px;
    }
    .sun-arc-wrap {
      grid-column: 1 / -1;
      order: -1;
    }
    .sun-arc-wrap svg { width: 100% !important; height: auto !important; }
    .sun-info:first-child { align-items: flex-start !important; }
    .sun-info:last-child { align-items: flex-end !important; }
    .sun-time { font-size: 22px; }
    .hourly-scroll { gap: 6px; }
    .hour-card { min-width: 52px; padding: 10px 7px; }
    .days-grid { grid-template-columns: repeat(2, 1fr); }
    .precip-total-card { flex-direction: column; gap: 14px; padding: 18px; }
    .precip-total-icon { font-size: 34px; }
    .precip-total-value { font-size: 38px; }
    .precip-total-breakdown { align-items: flex-start; width: 100%; }
    .precip-bar-wrap { width: 100%; }
    .charts-row { grid-template-columns: 1fr; }
    .windy-frame-wrap { height: 320px; }
    .windy-card-header { flex-direction: column; align-items: flex-start; gap: 10px; padding: 14px 16px; }
    .windy-overlay-btns { flex-wrap: wrap; gap: 6px; }
    .windy-layer-btn { padding: 6px 12px; font-size: 12px; }
    .search-input { font-size: 16px; } /* prevent iOS zoom */
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Weather Background ── */
  #weather-bg {
    position: fixed; inset: 0; z-index: 0;
    transition: background 2s ease;
    overflow: hidden;
  }
  /* Dark overlay so text/icons always stay readable */
  #weather-bg::after {
    content: '';
    position: absolute; inset: 0; z-index: 2;
    background: linear-gradient(180deg, rgba(0,0,0,0.42) 0%, rgba(0,0,0,0.60) 100%);
    pointer-events: none;
  }
  /* Sunny day – kept darker so text is legible */
  #weather-bg.bg-sunny {
    background: linear-gradient(180deg, #062770 0%, #0d4baa 20%, #1568d0 45%, #1e7fde 70%, #3494e0 100%);
  }
  /* Clear night */
  #weather-bg.bg-sunny.night {
    background: linear-gradient(180deg, #01020a 0%, #020614 25%, #030d24 55%, #08173a 100%);
  }
  /* Partly cloudy day */
  #weather-bg.bg-partly-cloudy {
    background: linear-gradient(180deg, #0e3870 0%, #1a5496 30%, #2a74bc 60%, #4a8fd0 100%);
  }
  /* Partly cloudy night */
  #weather-bg.bg-partly-cloudy.night {
    background: linear-gradient(180deg, #030812 0%, #07122a 35%, #0e1e3e 70%, #162540 100%);
  }
  /* Overcast */
  #weather-bg.bg-overcast {
    background: linear-gradient(180deg, #1e2b38 0%, #2e404f 25%, #3f5669 55%, #607585 80%, #8098a8 100%);
  }
  /* Fog */
  #weather-bg.bg-fog {
    background: linear-gradient(180deg, #3d4a56 0%, #5a6878 35%, #7a8a96 65%, #a0adb8 85%, #c5cfd8 100%);
  }
  /* Rain / Drizzle */
  #weather-bg.bg-rain {
    background: linear-gradient(180deg, #0a1520 0%, #122030 25%, #1a2d40 55%, #223550 80%, #2d4060 100%);
  }
  /* Snow */
  #weather-bg.bg-snow {
    background: linear-gradient(180deg, #5a7a95 0%, #7a9ab5 25%, #a0b8c8 55%, #c8d8e4 80%, #e4eef5 100%);
  }
  /* Thunderstorm */
  #weather-bg.bg-storm {
    background: linear-gradient(180deg, #06090f 0%, #0d1420 30%, #131c2d 60%, #1a2035 100%);
  }

  /* ══════════════════════════════════════
     SUN (zi)
  ══════════════════════════════════════ */
  .sun-orb {
    position: absolute;
    width: 200px; height: 200px; border-radius: 50%;
    top: 30px; right: 10%;
    background: radial-gradient(circle, rgba(255,240,80,0.95) 0%, rgba(255,200,30,0.65) 35%, rgba(255,140,0,0.2) 65%, transparent 85%);
    filter: blur(3px);
    animation: sun-pulse 6s ease-in-out infinite;
    pointer-events: none;
  }
  .sun-corona {
    position: absolute;
    width: 320px; height: 320px; border-radius: 50%;
    top: -30px; right: calc(10% - 60px);
    background: radial-gradient(circle, rgba(255,220,40,0.18) 20%, rgba(255,170,0,0.08) 55%, transparent 75%);
    filter: blur(20px);
    animation: sun-pulse 6s ease-in-out infinite reverse;
    pointer-events: none;
  }
  .sun-ray {
    position: absolute;
    top: 0; right: 10%; width: 200px; height: 200px;
    pointer-events: none;
  }
  .sun-ray::before, .sun-ray::after {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    width: 600px; height: 1px;
    transform-origin: left center;
    background: linear-gradient(to right, rgba(255,220,40,0.22), transparent);
    animation: ray-spin 20s linear infinite;
  }
  .sun-ray::after { animation-direction: reverse; animation-duration: 30s; width: 500px; }
  @keyframes ray-spin { to { transform: rotate(360deg); } }
  @keyframes sun-pulse {
    0%, 100% { transform: scale(1); opacity: 0.88; filter: blur(3px); }
    50% { transform: scale(1.1); opacity: 1; filter: blur(5px); }
  }
  /* heat shimmer */
  .heat-shimmer {
    position: absolute; bottom: 0; left: 0; right: 0; height: 35%;
    background: linear-gradient(0deg, rgba(255,180,30,0.05) 0%, transparent 100%);
    animation: shimmer-wave 4s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes shimmer-wave {
    0%, 100% { opacity: 0.3; transform: scaleY(1); }
    50% { opacity: 0.7; transform: scaleY(1.05); }
  }

  /* ══════════════════════════════════════
     MOON & STARS (noapte)
  ══════════════════════════════════════ */
  .moon-orb {
    position: absolute;
    width: 100px; height: 100px; border-radius: 50%;
    top: 60px; right: 13%;
    background: radial-gradient(circle at 38% 38%, rgba(230,240,255,0.95) 25%, rgba(190,210,255,0.55) 55%, transparent 80%);
    filter: blur(1.5px);
    animation: moon-glow 8s ease-in-out infinite;
    pointer-events: none;
    box-shadow: 0 0 60px rgba(160,190,255,0.35), 0 0 120px rgba(130,160,240,0.12);
  }
  .moon-halo {
    position: absolute;
    width: 200px; height: 200px; border-radius: 50%;
    top: 10px; right: calc(13% - 50px);
    background: radial-gradient(circle, transparent 40%, rgba(160,190,255,0.1) 60%, transparent 75%);
    filter: blur(8px);
    animation: moon-glow 8s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes moon-glow {
    0%, 100% { opacity: 0.75; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.04); }
  }
  .star {
    position: absolute;
    border-radius: 50%;
    background: rgba(220,235,255,0.9);
    animation: star-twinkle ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes star-twinkle {
    0%, 100% { opacity: 0.15; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1.3); }
  }
  .shooting-star {
    position: absolute;
    width: 120px; height: 1.5px;
    background: linear-gradient(to right, transparent, rgba(220,235,255,0.9), transparent);
    border-radius: 2px;
    animation: shoot linear forwards;
    pointer-events: none;
  }
  @keyframes shoot {
    0% { opacity: 0; transform: translateX(0) translateY(0); }
    10% { opacity: 1; }
    90% { opacity: 0.6; }
    100% { opacity: 0; transform: translateX(250px) translateY(120px); }
  }

  /* ══════════════════════════════════════
     CLOUDS
  ══════════════════════════════════════ */
  .cloud {
    position: absolute;
    border-radius: 50%;
    filter: blur(22px);
    animation: cloud-drift linear infinite;
    pointer-events: none;
  }
  @keyframes cloud-drift {
    0% { transform: translateX(-120px) translateY(0); }
    50% { transform: translateX(calc(50vw)) translateY(-8px); }
    100% { transform: translateX(calc(100vw + 120px)) translateY(0); }
  }

  /* ══════════════════════════════════════
     RAIN
  ══════════════════════════════════════ */
  .rain-container {
    position: absolute; inset: 0; overflow: hidden; pointer-events: none;
  }
  .rain-drop {
    position: absolute;
    top: -10%;
    background: linear-gradient(to bottom, transparent 0%, rgba(160,210,255,0.7) 100%);
    border-radius: 0 0 2px 2px;
    animation: rain-fall linear infinite;
  }
  @keyframes rain-fall {
    0%   { top: -10%; opacity: 0; }
    6%   { opacity: 1; }
    88%  { opacity: 0.65; }
    100% { top: 110%; opacity: 0; }
  }
  .rain-splash {
    position: absolute;
    bottom: 0;
    width: 6px; height: 2px;
    border-radius: 50%;
    background: rgba(160,210,255,0.5);
    animation: splash linear infinite;
    pointer-events: none;
  }
  @keyframes splash {
    0%   { transform: scaleX(0.2) scaleY(1); opacity: 0; }
    20%  { transform: scaleX(1.8) scaleY(0.4); opacity: 0.8; }
    100% { transform: scaleX(2.5) scaleY(0.1); opacity: 0; }
  }

  /* ══════════════════════════════════════
     SNOW
  ══════════════════════════════════════ */
  .snow-container {
    position: absolute; inset: 0; overflow: hidden; pointer-events: none;
  }
  .snow-flake {
    position: absolute;
    top: -6%;
    border-radius: 50%;
    background: rgba(255,255,255,0.9);
    animation: snow-fall linear infinite;
    filter: blur(0.4px);
    box-shadow: 0 0 4px rgba(255,255,255,0.6);
  }
  @keyframes snow-fall {
    0%   { top: -6%; transform: translateX(0) rotate(0deg); opacity: 0; }
    6%   { opacity: 0.95; }
    88%  { opacity: 0.8; }
    100% { top: 110%; transform: translateX(var(--drift, 50px)) rotate(360deg); opacity: 0; }
  }

  /* ══════════════════════════════════════
     LIGHTNING / STORM
  ══════════════════════════════════════ */
  .lightning-flash {
    position: absolute; inset: 0;
    opacity: 0;
    animation: lightning-strike var(--ls-dur, 9s) ease infinite var(--ls-delay, 0s);
    pointer-events: none;
  }
  @keyframes lightning-strike {
    0%,84%,91%,94%,100% { opacity: 0; background: transparent; }
    85%,88% { opacity: 1; background: rgba(200,225,255,0.22); }
    92%,93%  { opacity: 0.5; background: rgba(200,225,255,0.1); }
  }
  .lightning-bolt {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    opacity: 0;
    animation: bolt-flash var(--ls-dur, 9s) ease infinite var(--ls-delay, 0s);
    pointer-events: none;
  }
  @keyframes bolt-flash {
    0%,83%,89%,100% { opacity: 0; }
    84%,87% { opacity: 1; }
  }

  /* ══════════════════════════════════════
     FOG
  ══════════════════════════════════════ */
  .fog-layer {
    position: absolute; left: -15%; width: 130%;
    background: linear-gradient(90deg,
      transparent 0%,
      rgba(210,220,230,0.15) 25%,
      rgba(225,232,238,0.22) 55%,
      rgba(210,220,230,0.15) 75%,
      transparent 100%);
    filter: blur(30px);
    border-radius: 50%;
    animation: fog-drift ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes fog-drift {
    0%   { transform: translateX(-18%) scaleY(1); opacity: 0.35; }
    50%  { transform: translateX(0%) scaleY(1.15); opacity: 0.75; }
    100% { transform: translateX(18%) scaleY(1); opacity: 0.35; }
  }
</style>
</head>
<body>
<div id="weather-bg"></div>
<div class="noise"></div>
<div class="glow-orb a"></div>
<div class="glow-orb b"></div>
<div class="glow-orb c"></div>

<div class="app" style="padding-bottom: 0;">
  <div class="search-wrap" id="searchWrap">
    <div class="search-inner">
      <span class="search-icon">🔍</span>
      <input
        class="search-input"
        id="searchInput"
        type="text"
        placeholder="Caută un oraș sau localitate…"
        autocomplete="off"
        spellcheck="false"
      >
      <button class="search-clear" id="searchClear" title="Șterge">✕</button>
      <button class="gps-btn" id="gpsBtn" title="Folosește locația mea GPS" onclick="useGPSLocation()">
        <span class="gps-icon">📍</span>
        <span class="gps-label">Locația mea</span>
      </button>
    </div>
    <div class="search-suggestions" id="searchSuggestions"></div>
  </div>
</div>

<div class="app" id="app" style="padding-top: 0;">
  <div class="loading">
    <div class="spinner"></div>
    <div class="loading-text">Se încarcă datele meteo…</div>
  </div>
</div>

<script>
// ── State ──
let LAT = 44.4268, LON = 26.1025;
let TZ = 'Europe/Bucharest';
let CITY = 'București';
let COUNTRY = 'Romania';

let allData = null;
let selectedDay = 0;
let precipChart = null, tempChart = null, hourlyChart = null, windChart = null;
let radarLayer = 'radar';
let searchTimeout = null;
let focusedSuggestion = -1;

// ── WMO Codes ──
const WMO = {
  0:'Cer senin',1:'Predominant senin',2:'Parțial noros',3:'Cer acoperit',
  45:'Ceață',48:'Ceață cu chiciură',
  51:'Burniță ușoară',53:'Burniță',55:'Burniță abundentă',
  61:'Ploaie ușoară',63:'Ploaie',65:'Ploaie abundentă',
  71:'Ninsoare ușoară',73:'Ninsoare',75:'Ninsoare abundentă',
  77:'Granule de zăpadă',
  80:'Averse ușoare',81:'Averse',82:'Averse puternice',
  85:'Averse de ninsoare',86:'Averse puternice de ninsoare',
  95:'Furtună',96:'Furtună cu grindină',99:'Furtună puternică cu grindină'
};
const WMO_ICON = {
  0:'☀️',1:'🌤️',2:'⛅',3:'☁️',
  45:'🌫️',48:'🌫️',
  51:'🌦️',53:'🌦️',55:'🌧️',
  61:'🌧️',63:'🌧️',65:'⛈️',
  71:'❄️',73:'🌨️',75:'❄️',77:'🌨️',
  80:'🌦️',81:'🌧️',82:'⛈️',
  85:'🌨️',86:'❄️',
  95:'⛈️',96:'⛈️',99:'⛈️'
};
// Iconițe de noapte (lună în loc de soare pentru cer senin/parțial noros)
const WMO_ICON_NIGHT = {
  0:'🌕',1:'🌙',2:'🌙',3:'☁️',
  45:'🌫️',48:'🌫️',
  51:'🌦️',53:'🌦️',55:'🌧️',
  61:'🌧️',63:'🌧️',65:'⛈️',
  71:'❄️',73:'🌨️',75:'❄️',77:'🌨️',
  80:'🌦️',81:'🌧️',82:'⛈️',
  85:'🌨️',86:'❄️',
  95:'⛈️',96:'⛈️',99:'⛈️'
};
function icon(code){ return WMO_ICON[code]||'🌡️'; }
// Returnează iconița corectă în funcție de zi/noapte
function iconForTime(code, isDay){ return isDay ? (WMO_ICON[code]||'🌡️') : (WMO_ICON_NIGHT[code]||WMO_ICON[code]||'🌡️'); }
function desc(code){ return WMO[code]||'—'; }

// Determină dacă un slot orar este zi sau noapte folosind sunrise/sunset din zilele API
function getHourIsDay(data, timeStr) {
  const dateStr = timeStr.slice(0, 10);
  const dayIdx = data.daily.time.indexOf(dateStr);
  if (dayIdx < 0) return true; // fallback
  const rise = data.daily.sunrise[dayIdx]; // ex: "2025-05-19T06:04"
  const set  = data.daily.sunset[dayIdx];  // ex: "2025-05-19T20:38"
  return timeStr >= rise && timeStr < set;
}

// ── Search / Geocoding ──
const searchInput = document.getElementById('searchInput');
const searchClear = document.getElementById('searchClear');
const searchSugg  = document.getElementById('searchSuggestions');

searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim();
  searchClear.style.display = q ? 'block' : 'none';
  clearTimeout(searchTimeout);
  if (q.length < 2) { closeSuggestions(); return; }
  showSuggestionsLoading();
  searchTimeout = setTimeout(() => geocode(q), 300);
});

searchInput.addEventListener('keydown', e => {
  const items = searchSugg.querySelectorAll('.suggestion-item');
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    focusedSuggestion = Math.min(focusedSuggestion + 1, items.length - 1);
    updateSuggestionFocus(items);
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    focusedSuggestion = Math.max(focusedSuggestion - 1, 0);
    updateSuggestionFocus(items);
  } else if (e.key === 'Enter') {
    if (focusedSuggestion >= 0 && items[focusedSuggestion]) {
      items[focusedSuggestion].click();
    }
  } else if (e.key === 'Escape') {
    closeSuggestions();
    searchInput.blur();
  }
});

searchClear.addEventListener('click', () => {
  searchInput.value = '';
  searchClear.style.display = 'none';
  closeSuggestions();
  searchInput.focus();
});

document.addEventListener('click', e => {
  if (!document.getElementById('searchWrap').contains(e.target)) closeSuggestions();
});

function updateSuggestionFocus(items) {
  items.forEach((el, i) => el.classList.toggle('focused', i === focusedSuggestion));
}

function showSuggestionsLoading() {
  searchSugg.innerHTML = `<div class="search-loading"><div class="mini-spin"></div> Se caută…</div>`;
  searchSugg.classList.add('open');
}

function closeSuggestions() {
  searchSugg.classList.remove('open');
  searchSugg.innerHTML = '';
  focusedSuggestion = -1;
}

async function useGPSLocation() {
  const btn = document.getElementById('gpsBtn');
  if (!navigator.geolocation) {
    btn.style.color = '#f87171';
    btn.querySelector('.gps-label').textContent = 'Indisponibil';
    setTimeout(() => {
      btn.style.color = '';
      btn.querySelector('.gps-label').textContent = 'Locația mea';
    }, 2500);
    return;
  }

  btn.classList.add('loading');
  btn.querySelector('.gps-icon').textContent = '⟳';
  btn.querySelector('.gps-label').textContent = 'Se caută…';

  navigator.geolocation.getCurrentPosition(
    async (pos) => {
      const lat = pos.coords.latitude;
      const lon = pos.coords.longitude;
      try {
        const r = await fetch(
          `https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=ro`
        );
        const geo = await r.json();
        const city = geo.city || geo.locality || geo.principalSubdivision || 'Locația mea';
        const country = geo.countryName || '';
        const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || 'Europe/Bucharest';

        LAT = lat; LON = lon;
        CITY = city; COUNTRY = country; TZ = tz;

        searchInput.value = city + (country ? `, ${country}` : '');
        searchClear.style.display = 'block';
        closeSuggestions();

        btn.classList.remove('loading');
        btn.querySelector('.gps-icon').textContent = '✓';
        btn.querySelector('.gps-label').textContent = 'Găsit!';
        btn.style.color = 'var(--teal)';
        setTimeout(() => {
          btn.querySelector('.gps-icon').textContent = '📍';
          btn.querySelector('.gps-label').textContent = 'Locația mea';
          btn.style.color = '';
        }, 1800);

        loadWeather();
      } catch(e) {
        // Fallback: use coordinates directly without city name
        LAT = lat; LON = lon;
        CITY = `${lat.toFixed(2)}°N, ${lon.toFixed(2)}°E`;
        COUNTRY = '';
        TZ = Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC';
        searchInput.value = CITY;
        searchClear.style.display = 'block';
        btn.classList.remove('loading');
        btn.querySelector('.gps-icon').textContent = '📍';
        btn.querySelector('.gps-label').textContent = 'Locația mea';
        loadWeather();
      }
    },
    (err) => {
      btn.classList.remove('loading');
      btn.querySelector('.gps-icon').textContent = '⚠️';
      btn.querySelector('.gps-label').textContent =
        err.code === 1 ? 'Acces refuzat' :
        err.code === 2 ? 'Indisponibil' : 'Eroare GPS';
      btn.style.color = '#f87171';
      btn.style.borderColor = 'rgba(248,113,113,0.4)';
      setTimeout(() => {
        btn.querySelector('.gps-icon').textContent = '📍';
        btn.querySelector('.gps-label').textContent = 'Locația mea';
        btn.style.color = '';
        btn.style.borderColor = '';
      }, 3000);
    },
    { timeout: 10000, enableHighAccuracy: true }
  );
}

async function geocode(query) {
  try {
    const r = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=6&language=ro&format=json`);
    const data = await r.json();
    renderSuggestions(data.results || []);
  } catch(e) {
    searchSugg.innerHTML = `<div class="search-no-results">Serviciul de geocodare nu este disponibil.</div>`;
  }
}

function renderSuggestions(results) {
  if (!results.length) {
    searchSugg.innerHTML = `<div class="search-no-results">Nicio locație găsită.</div>`;
    searchSugg.classList.add('open');
    return;
  }
  focusedSuggestion = -1;
  searchSugg.innerHTML = results.map((r, i) => {
    const region = [r.admin1, r.country].filter(Boolean).join(', ');
    const pop = r.population ? `${r.population >= 1000000 ? (r.population/1000000).toFixed(1)+'M' : Math.round(r.population/1000)+'k'}` : '';
    return `<div class="suggestion-item" data-idx="${i}"
      data-lat="${r.latitude}" data-lon="${r.longitude}"
      data-city="${r.name}" data-country="${r.country||''}"
      data-tz="${r.timezone||'UTC'}">
      <div class="suggestion-pin-wrap"><span class="suggestion-pin">📍</span></div>
      <div class="suggestion-text">
        <div class="suggestion-name">${r.name}</div>
        ${region ? `<div class="suggestion-region">${region}</div>` : ''}
      </div>
      ${pop ? `<span class="suggestion-meta">${pop}</span>` : ''}
    </div>`;
  }).join('');
  searchSugg.classList.add('open');

  searchSugg.querySelectorAll('.suggestion-item').forEach(el => {
    el.addEventListener('click', () => {
      LAT = parseFloat(el.dataset.lat);
      LON = parseFloat(el.dataset.lon);
      CITY = el.dataset.city;
      COUNTRY = el.dataset.country;
      TZ = el.dataset.tz;
      searchInput.value = CITY + (COUNTRY ? `, ${COUNTRY}` : '');
      searchClear.style.display = 'block';
      closeSuggestions();
      loadWeather();
    });
  });
}

// ── Weather API ──
async function fetchWeather() {
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}` +
    `&hourly=temperature_2m,precipitation,weathercode,apparent_temperature,windspeed_10m,winddirection_10m` +
    `&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_sum,sunrise,sunset,precipitation_hours,windspeed_10m_max` +
    `&timezone=${encodeURIComponent(TZ)}&forecast_days=10&current_weather=true`;
  const r = await fetch(url);
  if (!r.ok) throw new Error('API error');
  return r.json();
}

function loadWeather() {
  selectedDay = 0;
  document.getElementById('app').innerHTML = `
    <div class="loading"><div class="spinner"></div><div class="loading-text">Se încarcă datele meteo…</div></div>`;
  fetchWeather()

    });
}

// ── Helpers ──
function formatTime(iso) {
  return new Date(iso).toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'});
}
function daylight(rise, set) {
  const diff = (new Date(set) - new Date(rise)) / 60000;
  const h = Math.floor(diff/60), m = Math.round(diff%60);
  return `${h}h ${m}m lumină naturală`;
}

function windDirLabel(deg) {
  if (deg == null) return '—';
  const dirs = ['N','NE','E','SE','S','SV','V','NV'];
  return dirs[Math.round(deg / 45) % 8];
}

function shortDay(iso) {
  return new Date(iso).toLocaleDateString('ro-RO', {weekday:'short'});
}
function shortDate(iso) {
  return new Date(iso).toLocaleDateString('ro-RO', {day:'numeric', month:'short'});
}

function drawSunArc(riseIso, setIso) {
  const rise = new Date(riseIso), set = new Date(setIso), now = new Date();
  let prog = Math.max(0, Math.min(1, (now - rise) / (set - rise)));
  const W = 260, H = 110, cx = W/2, cy = H+10, R = 110;
  const a = Math.PI + prog * Math.PI;
  const sunX = cx + R * Math.cos(a), sunY = cy + R * Math.sin(a);
  const arcPath = `M ${cx-R} ${cy} A ${R} ${R} 0 0 1 ${cx+R} ${cy}`;
  return `
    <svg class="arc-svg" width="${W}" height="${H+8}" viewBox="0 0 ${W} ${H+8}">
      <defs>
        <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#f5c842" stop-opacity="0.2"/>
          <stop offset="50%" stop-color="#f5c842" stop-opacity="0.8"/>
          <stop offset="100%" stop-color="#f87c3a" stop-opacity="0.2"/>
        </linearGradient>
        <filter id="sunGlow">
          <feGaussianBlur stdDeviation="4" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <path d="${arcPath}" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>
      <path d="${arcPath}" fill="none" stroke="url(#arcGrad)" stroke-width="2" stroke-linecap="round"
        stroke-dasharray="${Math.PI*R}" stroke-dashoffset="${Math.PI*R*(1-prog)}"/>
      ${prog>0&&prog<1 ? `
        <circle cx="${sunX}" cy="${sunY}" r="8" fill="#f5c842" filter="url(#sunGlow)" opacity="0.9"/>
        <circle cx="${sunX}" cy="${sunY}" r="4" fill="#fff8e0"/>
      ` : ''}
      <line x1="${cx-R-8}" y1="${cy}" x2="${cx+R+8}" y2="${cy}" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    </svg>`;
}

function getHourlyForDay(data, dayIndex) {
  const dateStr = data.daily.time[dayIndex];
  return data.hourly.time
    .map((t, i) => ({ t, i }))
    .filter(({t}) => t.startsWith(dateStr))
    .map(({i}) => ({
      hour: data.hourly.time[i].slice(11,16),
      temp: Math.round(data.hourly.temperature_2m[i]),
      prec: +(data.hourly.precipitation[i]).toFixed(1),
      wind: +(data.hourly.windspeed_10m[i]||0).toFixed(1),
      wdir: data.hourly.winddirection_10m[i]||0,
      code: data.hourly.weathercode[i],
      feel: Math.round(data.hourly.apparent_temperature[i]),
      isDay: getHourIsDay(data, data.hourly.time[i]),
      isNow: false
    }));
}

function getHourlyFromNow(data, count = 24) {
  const now = new Date();
  const pad = n => String(n).padStart(2,'0');
  const localIso = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}T${pad(now.getHours())}`;

  let startIdx = data.hourly.time.findIndex(t => t.startsWith(localIso));
  if (startIdx === -1) {
    startIdx = data.hourly.time.findIndex(t => new Date(t) >= now);
  }
  if (startIdx === -1) startIdx = 0;

  const result = [];
  for (let i = startIdx; i < startIdx + count && i < data.hourly.time.length; i++) {
    const prevDate = i > startIdx ? data.hourly.time[i-1].slice(0,10) : null;
    const thisDate = data.hourly.time[i].slice(0,10);
    result.push({
      hour: data.hourly.time[i].slice(11,16),
      temp: Math.round(data.hourly.temperature_2m[i]),
      prec: +(data.hourly.precipitation[i]).toFixed(1),
      wind: +(data.hourly.windspeed_10m[i]||0).toFixed(1),
      wdir: data.hourly.winddirection_10m[i]||0,
      code: data.hourly.weathercode[i],
      feel: Math.round(data.hourly.apparent_temperature[i]),
      isDay: getHourIsDay(data, data.hourly.time[i]),
      isNow: i === startIdx,
      newDay: prevDate && thisDate !== prevDate ? thisDate : null
    });
  }
  return result;
}

function buildPrecipTotalCard(data) {
  const sums = getRemainingPrecipPerDay(data);
  const total = +sums.reduce((a,b)=>a+b,0).toFixed(1);
  const rainyDays = sums.filter(v => v >= 0.1).length;
  const pct = Math.min(100, Math.round(total / 100 * 100));
  let context = total === 0 ? 'Perioadă secetoasă — nicio ploaie așteptată'
    : total < 10 ? 'Precipitații foarte reduse așteptate'
    : total < 30 ? 'Precipitații ușoare în această perioadă'
    : total < 60 ? 'Precipitații moderate — ia umbrela cu tine'
    : total < 100 ? 'Precipitații abundente așteptate'
    : 'Precipitații foarte abundente — fii pregătit';
  let emoji = total === 0 ? '🏜️' : total < 15 ? '🌂' : total < 50 ? '☔' : '🌊';

  return `
    <div class="precip-total-card">
      <div class="precip-total-icon">${emoji}</div>
      <div class="precip-total-info">
        <div class="precip-total-label">Precipitații rămase · 10 zile</div>
        <div class="precip-total-value">${total}<span>mm</span></div>
        <div class="precip-total-sub">${context}</div>
      </div>
      <div class="precip-total-breakdown">
        <div class="precip-rainy-days">
          <strong>${rainyDays}</strong> zi${rainyDays !== 1 ? 'le' : ''} ${rainyDays !== 1 ? 'ploioase' : 'ploioasă'}
        </div>
        <div class="precip-bar-wrap">
          <div class="precip-bar-fill" id="precipBarFill" style="width:0%"></div>
        </div>
        <div class="precip-bar-label">${pct}% dintr-o perioadă ploioasă intensă (100mm)</div>
      </div>
    </div>`;
}

function onRadarLoad() {
  const loader = document.getElementById('windyLoader');
  if (loader) { loader.classList.add('hidden'); setTimeout(() => loader.remove(), 400); }

function updateVentuskyMap() {
  const frame = document.getElementById('ventuskyFrame');
  if (!frame) return;
  const newSrc = `https://embed.ventusky.com/?p=${LAT};${LON};7&l=radar`;
  if (frame.src !== newSrc) {
    // Arătăm loader-ul din nou cât se reîncarcă harta
    const wrap = frame.parentElement;
    let loader = document.getElementById('windyLoader');
    if (!loader) {
      loader = document.createElement('div');
      loader.id = 'windyLoader';
      loader.className = 'windy-loader';
      loader.innerHTML = `<div class="spinner" style="border-top-color:var(--teal)"></div><div class="windy-loader-text">Se actualizează harta…</div>`;
      wrap.insertBefore(loader, frame);
    } else {
      loader.classList.remove('hidden');
      loader.querySelector('.windy-loader-text').textContent = 'Se actualizează harta…';
    }
    frame.onload = onRadarLoad;
    frame.src = newSrc;
  }
}

// ── Charts ──
function destroyChart(ref) { if (ref) { try { ref.destroy(); } catch(e){} } }

function getRemainingPrecipPerDay(data) {
  const now = new Date();
  const pad = n => String(n).padStart(2,'0');
  const todayStr = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
  const currentHourStr = `${todayStr}T${pad(now.getHours())}`;

  return data.daily.time.map((d, i) => {
    if (i === 0) {
      let remaining = 0;
      for (let j = 0; j < data.hourly.time.length; j++) {
        const t = data.hourly.time[j];
        if (t.startsWith(todayStr) && t >= currentHourStr) {
          remaining += data.hourly.precipitation[j] || 0;
        }
      }
      return +remaining.toFixed(1);
    }
    return +(data.daily.precipitation_sum[i]||0).toFixed(1);
  });
}

function selectDay(i) {
  selectedDay = i;
  if (!allData) return;
  document.querySelectorAll('.day-card').forEach((el, idx) => el.classList.toggle('active', idx===i));
  const sunData = allData.daily;
  document.querySelector('.sun-rise-time').textContent = formatTime(sunData.sunrise[i]);
  document.querySelector('.sun-set-time').textContent = formatTime(sunData.sunset[i]);
  document.querySelector('.sun-duration').textContent = daylight(sunData.sunrise[i], sunData.sunset[i]);
  document.querySelector('.sun-arc-wrap').innerHTML = drawSunArc(sunData.sunrise[i], sunData.sunset[i]);

  document.querySelector('.hourly-chart-title').textContent =
    `Orar — ${i===0?'Azi (din ora curentă)':shortDate(allData.daily.time[i])}`;
  drawHourlyChart(hours);
  if (allData) drawWindChart(hours, Math.round(allData.current_weather.windspeed));
}

    ${buildPrecipTotalCard(data)}

    <div class="hourly-chart-card">
      <div class="chart-title hourly-chart-title">Orar — Azi</div>
      <div class="hourly-chart-wrap"><canvas id="hourlyChart"></canvas></div>
    </div>

    <div class="charts-row">
      <div class="chart-card">
        <div class="chart-title">Precipitații rămase · 10 zile (mm)</div>
        <div class="chart-wrap"><canvas id="precipChart"></canvas></div>
      </div>
      <div class="chart-card">
        <div class="chart-title">Interval temperaturi · 10 zile</div>
        <div class="chart-wrap"><canvas id="tempChart"></canvas></div>
      </div>
    </div>

    <div class="wind-chart-card">
  <div class="wind-chart-header">
    <div>
      <div class="chart-title" style="margin-bottom:4px">Viteza vântului · 24h</div>
      <div class="wind-chart-subtitle">Linia punctată galbenă = viteza actuală</div>
    </div>
    <div class="wind-now-badge">
      <div class="wind-compass" id="windCompass"
           style="transform:rotate(${cw.winddirection}deg)">↑</div>
      <div>
        <div class="wind-now-val">${Math.round(cw.windspeed)} <span>km/h</span></div>
        <div class="wind-now-dir">${windDirLabel(cw.winddirection)}</div>
      </div>
    </div>
  </div>
  <div class="wind-chart-wrap"><canvas id="windChart"></canvas></div>
</div>

    <div class="sun-section">
      <div class="sun-info" style="align-items:flex-start">
        <div class="sun-label">Răsărit</div>
        <div class="sun-time sun-rise-time">${formatTime(d.sunrise[0])}</div>
      </div>
      <div class="sun-arc-wrap">${drawSunArc(d.sunrise[0], d.sunset[0])}</div>
      <div class="sun-info" style="align-items:flex-end">
        <div class="sun-label">Apus</div>
        <div class="sun-time sun-set-time">${formatTime(d.sunset[0])}</div>
        <div class="sun-duration">${daylight(d.sunrise[0], d.sunset[0])}</div>
      </div>
    </div>

    ${buildWindySection()}
  `;

  document.getElementById('app').innerHTML = html;

  setTimeout(() => {
    const fill = document.getElementById('precipBarFill');
    if (fill) {
      const remainingSums = getRemainingPrecipPerDay(data);
      const total = remainingSums.reduce((a,b)=>a+b,0);
      fill.style.width = Math.min(100, Math.round(total)) + '%';
    }
    drawPrecipChart(data);
    drawTempChart(data);
    drawHourlyChart(todayHours);
    drawWindChart(todayHours, Math.round(cw.windspeed));
  }, 80);
}

// ── Weather Background ──
function getWeatherBgClass(code, isDay) {
  if ([95,96,99].includes(code)) return 'bg-storm';
  if ([71,73,75,77,85,86].includes(code)) return 'bg-snow';
  if ([51,53,55,61,63,65,80,81,82].includes(code)) return 'bg-rain';
  if ([45,48].includes(code)) return 'bg-fog';
  if (code === 3) return 'bg-overcast';
  if (code === 2) return 'bg-partly-cloudy';
  if (code === 0 || code === 1) return 'bg-sunny';
  return 'bg-overcast';
}

function buildRain(count, angle = 12) {
  let html = '<div class="rain-container">';
  // picături principale — variate în lățime, lungime, opacitate, viteză
  for (let i = 0; i < count; i++) {
    const left  = Math.random() * 110 - 5;
    const dur   = 0.45 + Math.random() * 0.7;
    const delay = -(Math.random() * 3);
    const h     = 55 + Math.random() * 90;
    const w     = 1 + Math.random() * 1.2;
    const op    = 0.35 + Math.random() * 0.55;
    html += `<div class="rain-drop" style="left:${left}%;height:${h}px;width:${w}px;animation-duration:${dur}s;animation-delay:${delay}s;opacity:${op};transform:rotate(${angle}deg);transform-origin:top center"></div>`;
  }
  // splash-uri la baza ecranului
  for (let i = 0; i < Math.floor(count * 0.3); i++) {
    const left  = Math.random() * 100;
    const dur   = 0.5 + Math.random() * 0.6;
    const delay = -(Math.random() * 2);
    html += `<div class="rain-splash" style="left:${left}%;animation-duration:${dur}s;animation-delay:${delay}s"></div>`;
  }
  return html + '</div>';
}

function buildSnow(count) {
  let html = '<div class="snow-container">';
  for (let i = 0; i < count; i++) {
    const left  = Math.random() * 100;
    const dur   = 5 + Math.random() * 9;
    const delay = -(Math.random() * 12);
    const sz    = 2 + Math.random() * 6;
    const drift = (Math.random() - 0.5) * 120;
    const blur  = sz > 5 ? 1 : 0.3;
    html += `<div class="snow-flake" style="left:${left}%;width:${sz}px;height:${sz}px;animation-duration:${dur}s;animation-delay:${delay}s;--drift:${drift}px;filter:blur(${blur}px);opacity:${0.6+Math.random()*0.4}"></div>`;
  }
  return html + '</div>';
}

function buildClouds(color, count) {
  let html = '';
  for (let i = 0; i < count; i++) {
    const top   = 2 + Math.random() * 40;
    const sz    = 200 + Math.random() * 320;
    const dur   = 55 + Math.random() * 90;
    const delay = -(Math.random() * 90);
    const vert  = (Math.random() - 0.5) * 12;
    // fiecare nor are câteva straturi pentru volum
    html += `<div class="cloud" style="top:${top}%;width:${sz}px;height:${sz*0.55}px;background:${color};animation-duration:${dur}s;animation-delay:${delay}s;opacity:${0.28+Math.random()*0.3}"></div>`;
    html += `<div class="cloud" style="top:${top+4}%;width:${sz*0.65}px;height:${sz*0.38}px;background:${color};animation-duration:${dur*0.85}s;animation-delay:${delay-8}s;opacity:${0.18+Math.random()*0.2}"></div>`;
  }
  return html;
}

function buildStars(count) {
  let html = '';
  for (let i = 0; i < count; i++) {
    const top   = Math.random() * 75;
    const left  = Math.random() * 100;
    const dur   = 1.5 + Math.random() * 5;
    const delay = -(Math.random() * 5);
    const r     = Math.random();
    const sz    = r < 0.08 ? 4 : r < 0.25 ? 3 : r < 0.55 ? 2 : 1.5;
    const glow  = sz >= 3 ? `box-shadow:0 0 ${sz*3}px rgba(220,235,255,0.8)` : '';
    html += `<div class="star" style="top:${top}%;left:${left}%;width:${sz}px;height:${sz}px;animation-duration:${dur}s;animation-delay:${delay}s;${glow}"></div>`;
  }
  // 2 shooting stars cu timing aleatoriu
  for (let i = 0; i < 2; i++) {
    const top   = 5 + Math.random() * 35;
    const left  = 10 + Math.random() * 60;
    const dur   = 1.2 + Math.random() * 1;
    const delay = 3 + Math.random() * 18;
    const rot   = 20 + Math.random() * 30;
    html += `<div class="shooting-star" style="top:${top}%;left:${left}%;transform:rotate(${rot}deg);animation-duration:${dur}s;animation-delay:${delay}s;animation-iteration-count:infinite"></div>`;
  }
  return html;
}

function updateWeatherBg(code, isDay) {
  const bg = document.getElementById('weather-bg');
  const cls = getWeatherBgClass(code, isDay);
  bg.className = cls + (isDay ? '' : ' night');

  const bgMap = {
    'bg-sunny':         isDay ? '#062770' : '#01020a',
    'bg-partly-cloudy': isDay ? '#0e3870' : '#030812',
    'bg-overcast':      '#1e2b38',
    'bg-fog':           '#3d4a56',
    'bg-rain':          '#0a1520',
    'bg-snow':          '#5a7a95',
    'bg-storm':         '#06090f',
  };
  const bodyColor = bgMap[cls] || '#07091a';
  document.documentElement.style.background = bodyColor;
  document.body.style.background = bodyColor;

  let inner = '';

  if (cls === 'bg-sunny') {
    if (isDay) {
      inner = '<div class="sun-ray"></div><div class="sun-corona"></div><div class="sun-orb"></div><div class="heat-shimmer"></div>'
             + buildClouds('rgba(255,255,255,0.5)', 2);
    } else {
      inner = '<div class="moon-halo"></div><div class="moon-orb"></div>' + buildStars(100);
    }
  } else if (cls === 'bg-partly-cloudy') {
    if (isDay) {
      inner = '<div class="sun-corona" style="opacity:0.6;width:250px;height:250px;top:-10px"></div>'
             + '<div class="sun-orb" style="opacity:0.55;width:140px;height:140px;top:55px"></div>'
             + buildClouds('rgba(255,255,255,0.58)', 5);
    } else {
      inner = '<div class="moon-halo" style="opacity:0.5"></div>'
             + '<div class="moon-orb" style="opacity:0.55;width:80px;height:80px"></div>'
             + buildStars(50)
             + buildClouds('rgba(70,95,140,0.5)', 4);
    }
  } else if (cls === 'bg-overcast') {
    inner = buildClouds('rgba(110,130,155,0.6)', 8);
  } else if (cls === 'bg-fog') {
    for (let i = 0; i < 6; i++) {
      const top = 5 + i * 16;
      const h   = 20 + Math.random() * 20;
      const dur = 20 + i * 6;
      const delay = i * -6;
      inner += `<div class="fog-layer" style="top:${top}%;height:${h}%;animation-duration:${dur}s;animation-delay:${delay}s;animation-direction:${i%2?'reverse':'normal'}"></div>`;
    }
  } else if (cls === 'bg-rain') {
    inner = buildClouds('rgba(50,70,100,0.65)', 6) + buildRain(90, 10);
  } else if (cls === 'bg-snow') {
    inner = buildClouds('rgba(155,175,200,0.5)', 5) + buildSnow(70);
  } else if (cls === 'bg-storm') {
    inner = buildClouds('rgba(25,35,55,0.85)', 9)
           + buildRain(110, 18)
           // două fulgere cu timing diferit
           + `<div class="lightning-flash" style="--ls-dur:8s;--ls-delay:0s"></div>`
           + `<div class="lightning-flash" style="--ls-dur:11s;--ls-delay:4s"></div>`
           + `<svg class="lightning-bolt" style="--ls-dur:8s;--ls-delay:0s" viewBox="0 0 400 700" xmlns="http://www.w3.org/2000/svg">
               <polyline points="230,0 185,250 240,250 165,520" fill="none" stroke="rgba(210,230,255,0.95)" stroke-width="3" stroke-linejoin="round"/>
               <polyline points="230,0 185,250 240,250 165,520" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="7" stroke-linejoin="round" filter="url(#glow)"/>
               <defs><filter id="glow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
             </svg>`
           + `<svg class="lightning-bolt" style="--ls-dur:11s;--ls-delay:4s" viewBox="0 0 400 700" xmlns="http://www.w3.org/2000/svg">
               <polyline points="140,0 100,200 155,200 80,440" fill="none" stroke="rgba(200,220,255,0.8)" stroke-width="2.5" stroke-linejoin="round"/>
             </svg>`;
  }
  bg.innerHTML = inner;
}

// ── Boot ──
loadWeather();
</script>
