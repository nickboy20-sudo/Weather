<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vreme • v3</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=DM+Sans:wght@300;400;500;700&display=swap');

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg1:#0f2027;--bg2:#203a43;--bg3:#2c5364;
  --glass:rgba(255,255,255,0.08);
  --glass-border:rgba(255,255,255,0.15);
  --text:#e8f4f8;--text-dim:rgba(232,244,248,0.62);
  --accent:#4fc3f7;
  --card-radius:20px;
  --trans:all 0.5s cubic-bezier(0.4,0,0.2,1);
}

html{background:var(--bg1)}
body{
  font-family:'Inter',sans-serif;
  min-height:100vh;
  background:var(--bg1);
  color:var(--text);
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}

/* BACKGROUNDS */
#bg{position:fixed;inset:0;z-index:0;background:linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3));transition:background 1.2s ease}
body.weather-clear-day #bg{background:linear-gradient(160deg,#1565c0 0%,#1e88e5 40%,#42a5f5 70%,#90caf9 100%)}
body.weather-clear-night #bg{background:linear-gradient(160deg,#0a0e27 0%,#0d1b4b 50%,#1a237e 100%)}
body.weather-clouds-day #bg{background:linear-gradient(160deg,#37474f 0%,#546e7a 50%,#78909c 100%)}
body.weather-clouds-night #bg{background:linear-gradient(160deg,#1c2030 0%,#263045 50%,#37474f 100%)}
body.weather-rain-day #bg{background:linear-gradient(160deg,#1a237e 0%,#283593 40%,#3949ab 70%,#5c6bc0 100%)}
body.weather-rain-night #bg{background:linear-gradient(160deg,#0d0d1a 0%,#1a1a3e 50%,#252565 100%)}
body.weather-storm-day #bg{background:linear-gradient(160deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%)}
body.weather-storm-night #bg{background:linear-gradient(160deg,#0a0a0f 0%,#0f0f1a 50%,#1a1a2e 100%)}
body.weather-snow-day #bg{background:linear-gradient(160deg,#b3e5fc 0%,#e1f5fe 50%,#f5f5f5 100%);color:#1a237e}
body.weather-snow-night #bg{background:linear-gradient(160deg,#1c2f3f 0%,#263545 50%,#37474f 100%)}
body.weather-fog-day #bg{background:linear-gradient(160deg,#607d8b 0%,#90a4ae 50%,#b0bec5 100%)}
body.weather-fog-night #bg{background:linear-gradient(160deg,#1c2228 0%,#2c3440 50%,#37444f 100%)}

/* PARTICLES */
#particles{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
@keyframes fall{0%{transform:translateY(-20px);opacity:.7}100%{transform:translateY(110vh) translateX(20px);opacity:0}}
@keyframes flake{0%{transform:translateY(-20px) rotate(0deg);opacity:.9}100%{transform:translateY(110vh) rotate(360deg);opacity:0}}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes lightning{0%,95%,100%{opacity:0}96%,98%{opacity:1}}
@keyframes drift{0%{transform:translateX(-60px);opacity:0}20%{opacity:.55}80%{opacity:.55}100%{transform:translateX(110vw);opacity:0}}

/* LAYOUT */
#app{position:relative;z-index:2;min-height:100vh;max-width:1120px;margin:0 auto;padding:28px 24px 64px}

/* SEARCH */
.search-wrap{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.search-box{flex:1;position:relative;min-width:220px}
.search-box input{width:100%;padding:14px 20px;background:rgba(255,255,255,0.12);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.2);border-radius:50px;color:var(--text);font-family:'Inter',sans-serif;font-size:15px;outline:none;transition:var(--trans)}
.search-box input::placeholder{color:var(--text-dim)}
.search-box input:focus{background:rgba(255,255,255,0.18);border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,195,247,0.15)}
.search-icon{position:absolute;right:16px;top:50%;transform:translateY(-50%);opacity:.5;pointer-events:none}
.suggestions{position:absolute;top:calc(100% + 8px);left:0;right:0;background:rgba(15,32,39,0.96);backdrop-filter:blur(30px);border:1px solid rgba(255,255,255,0.15);border-radius:16px;overflow:hidden;z-index:100;display:none}
.suggestions.open{display:block}
.sug-item{padding:12px 18px;cursor:pointer;font-size:14px;display:flex;align-items:center;gap:10px}
.sug-item:hover{background:rgba(79,195,247,0.15)}

.btn-icon{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,0.12);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.2);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:var(--trans);flex-shrink:0}
.btn-icon:hover{background:rgba(79,195,247,0.22);border-color:var(--accent);transform:scale(1.04)}
.btn-icon.active{color:#ffca28;border-color:rgba(255,202,40,0.5);background:rgba(255,202,40,0.14)}
.btn-icon.active svg{fill:#ffca28}
.btn-icon.copied{color:#69f0ae;border-color:rgba(105,240,174,0.5)}
@keyframes spin{to{transform:rotate(360deg)}}
.btn-icon.loading{animation:spin 1s linear infinite}

.btn-quick{display:flex;align-items:center;gap:6px;padding:7px 14px;background:rgba(255,255,255,0.09);border:1px solid rgba(255,255,255,0.15);border-radius:50px;color:var(--text);font-family:'Inter',sans-serif;font-size:12.5px;cursor:pointer;transition:all .2s;white-space:nowrap}
.btn-quick:hover{background:rgba(79,195,247,0.2);border-color:rgba(79,195,247,0.5)}
.btn-quick.active{background:rgba(79,195,247,0.25);border-color:rgba(79,195,247,0.6);color:#4fc3f7}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(20,30,40,0.92);backdrop-filter:blur(20px);border:1px solid var(--glass-border);color:var(--text);padding:11px 20px;border-radius:50px;font-size:13px;font-weight:500;z-index:500;opacity:0;pointer-events:none;transition:all .3s ease}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* CARDS */
.card{background:var(--glass);backdrop-filter:blur(24px);border:1px solid var(--glass-border);border-radius:var(--card-radius);padding:24px;margin-bottom:20px}
.section-title{font-size:11px;text-transform:uppercase;letter-spacing:1.4px;color:var(--text-dim);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.section-title::after{content:'';flex:1;height:1px;background:rgba(255,255,255,0.1)}

/* MAIN */
.main-card{padding:32px;position:relative;overflow:hidden}
.location-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-dim);margin-bottom:6px;flex-wrap:wrap}
.city-name{font-family:'DM Sans',sans-serif;font-size:clamp(24px,4.5vw,36px);font-weight:700;letter-spacing:-0.3px}
.weather-main{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;margin-top:16px}
.temp-block{display:flex;align-items:flex-start;gap:4px}
.temp-val{font-size:clamp(56px,10vw,88px);font-weight:300;line-height:1;letter-spacing:-3px;font-family:'DM Sans',sans-serif}
.temp-unit{font-size:26px;margin-top:10px;opacity:.7}
.weather-icon-main{width:110px;height:110px;flex-shrink:0}
.weather-desc{font-size:15px;text-transform:capitalize;color:var(--text-dim);margin-top:2px}
.feel{font-size:13px;color:var(--text-dim);margin-top:2px}

.rain-alert{display:none;background:rgba(244,67,54,0.16);border:1px solid rgba(244,67,54,0.35);color:#ffab91;padding:10px 14px;border-radius:12px;margin-top:12px;font-size:13.5px;font-weight:500;align-items:center;gap:8px}
.rain-alert.info{background:rgba(79,195,247,0.13);border-color:rgba(79,195,247,0.3);color:#b3e5fc}

.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-top:22px}
.stat{background:rgba(255,255,255,0.06);border-radius:14px;padding:13px}
.stat-label{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.4px}
.stat-val{font-size:17px;font-weight:600;margin-top:3px}
.stat-unit{font-size:11px;color:var(--text-dim)}

/* HOURLY */
.hourly-scroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.hour-card{flex-shrink:0;width:72px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:11px 8px;text-align:center}
.hour-card.now{background:rgba(79,195,247,0.2);border-color:rgba(79,195,247,0.4)}
.hour-time{font-size:11px;color:var(--text-dim)}
.hour-icon{width:32px;height:32px}
.hour-temp{font-size:15px;font-weight:600}
.hour-rain{font-size:10px;color:#90caf9;min-height:14px}

/* CHARTS */
.chart-wrap{position:relative;height:180px}

/* 10-DAY */
.day-row{display:flex;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.06);gap:12px;flex-wrap:wrap}
.day-row:last-child{border-bottom:none}
.day-name{width:88px;font-size:13.5px;flex-shrink:0}
.day-icon{width:28px;height:28px;flex-shrink:0}
.day-desc{flex:1;font-size:12px;color:var(--text-dim);min-width:80px}
.day-rain{font-size:12px;color:#90caf9;width:44px;text-align:right}
.day-temps{display:flex;align-items:center;gap:8px}
.day-min{font-size:13px;color:var(--text-dim)}
.day-max{font-size:15px;font-weight:600}

/* WIND */
.wind-top{display:flex;align-items:center;gap:24px;flex-wrap:wrap;margin-bottom:14px}
.compass-ring{width:96px;height:96px;border-radius:50%;border:2px solid rgba(255,255,255,0.15);position:relative;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.compass-arrow{width:3px;height:38px;background:linear-gradient(to bottom,var(--accent),rgba(79,195,247,0.2));border-radius:2px;position:absolute;transform-origin:bottom center;bottom:50%;left:50%;margin-left:-1.5px;transition:transform .8s cubic-bezier(0.4,0,0.2,1)}
.compass-dirs span{position:absolute;font-size:9px;color:rgba(255,255,255,0.35)}
.compass-dirs .cn{top:6px;left:50%;transform:translateX(-50%);color:rgba(255,90,90,0.85)}
.compass-dirs .cs{bottom:6px;left:50%;transform:translateX(-50%)}
.compass-dirs .cw{left:7px;top:50%;transform:translateY(-50%)}
.compass-dirs .ce{right:7px;top:50%;transform:translateY(-50%)}
.wind-speed-big{font-size:38px;font-weight:300;font-family:'DM Sans',sans-serif;line-height:1}
.wind-label{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.8px}
.wind-stat-row{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,0.06)}

/* AQI */
.aqi-top{display:flex;align-items:center;gap:16px;margin-bottom:14px;flex-wrap:wrap}
.aqi-badge{display:flex;flex-direction:column;align-items:center;justify-content:center;width:70px;height:70px;border-radius:50%;flex-shrink:0;border:3px solid currentColor}
.aqi-badge .aqi-num{font-size:24px;font-weight:700;line-height:1}
.aqi-badge .aqi-lbl{font-size:9px;text-transform:uppercase;letter-spacing:.5px;opacity:.8;margin-top:2px}
.aqi-desc-title{font-size:15px;font-weight:600}
.aqi-desc-sub{font-size:13px;color:var(--text-dim)}
.aqi-pollutants{display:grid;grid-template-columns:repeat(auto-fit,minmax(72px,1fr));gap:10px}
.aqi-pollutant{background:rgba(255,255,255,0.06);border-radius:12px;padding:10px;text-align:center}
.aqi-pollutant-name{font-size:11px;color:var(--text-dim)}
.aqi-pollutant-val{font-size:15px;font-weight:600;margin-top:3px}

/* SUN ARC - FIXED */
.sun-arc-wrap{position:relative;width:100%;max-width:420px;margin:8px auto 0}
.sun-arc-svg{width:100%;height:auto;display:block}
.sun-arc-labels{display:flex;justify-content:space-between;font-size:12px;color:var(--text-dim);margin-top:4px;max-width:420px;margin-left:auto;margin-right:auto;padding:0 4px}
.sun-arc-now{font-size:13px;text-align:center;color:var(--text-dim);margin-top:6px}

/* OUTFIT */
.outfit-grid{display:flex;flex-wrap:wrap;gap:9px;margin-top:8px}
.outfit-chip{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);border-radius:50px;padding:8px 13px;font-size:13px;display:flex;align-items:center;gap:6px}

/* ACTIVITIES */
.activities-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:8px}
.activity{background:rgba(255,255,255,0.06);border-radius:13px;padding:11px 13px;display:flex;justify-content:space-between;align-items:center}
.activity-name{font-size:13px}
.activity-score{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
.score-good{background:rgba(105,240,174,0.15);color:#69f0ae}
.score-mid{background:rgba(255,202,40,0.15);color:#ffd54f}
.score-bad{background:rgba(255,138,128,0.15);color:#ffab91}

/* ALERTS BAND */
#alerts-band{margin-bottom:14px}
.alert-item{display:flex;align-items:flex-start;gap:10px;padding:11px 15px;border-radius:14px;margin-bottom:8px;font-size:13.5px;font-weight:500;animation:alertIn .35s ease}
@keyframes alertIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.alert-item:last-child{margin-bottom:0}
.alert-severe{background:rgba(244,67,54,0.18);border:1px solid rgba(244,67,54,0.45);color:#ffcdd2}
.alert-warn{background:rgba(255,152,0,0.16);border:1px solid rgba(255,152,0,0.40);color:#ffe0b2}
.alert-info{background:rgba(79,195,247,0.13);border:1px solid rgba(79,195,247,0.35);color:#b3e5fc}
.alert-icon{font-size:16px;flex-shrink:0;margin-top:1px}
.alert-text b{display:block;font-size:14px;margin-bottom:2px}
.alert-text span{font-size:12.5px;opacity:.82}

/* UV BAR */
.uv-bar-wrap{height:6px;border-radius:3px;background:linear-gradient(to right,#69f0ae,#ffee58,#ffa726,#ef5350,#8e24aa);margin-top:4px;position:relative}
.uv-bar-dot{position:absolute;top:-3px;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid rgba(0,0,0,.3);transform:translateX(-50%);transition:left .5s}

/* TEMP BAR MIN/MAX */
.temp-bar-wrap{margin-top:5px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-dim)}
.temp-bar-track{flex:1;height:5px;border-radius:3px;background:linear-gradient(to right,#4fc3f7,#ffca28,#ff7043);position:relative}
.temp-bar-dot{position:absolute;top:-4px;width:13px;height:13px;border-radius:50%;background:#fff;border:2px solid rgba(0,0,0,.25);transform:translateX(-50%);transition:left .5s}

/* HUMIDITY BAR */
.hum-bar-wrap{height:5px;border-radius:3px;background:rgba(255,255,255,0.12);margin-top:4px;position:relative;overflow:hidden}
.hum-bar-fill{height:100%;border-radius:3px;background:linear-gradient(to right,#81d4fa,#4fc3f7);transition:width .5s}

/* POP BAR */
.pop-bar{height:3px;border-radius:2px;background:rgba(79,195,247,0.25);margin-top:4px}
.pop-fill{height:100%;border-radius:2px;background:#4fc3f7;transition:width .4s}

/* DEW POINT / WEEKLY / MOON PHASE */
.moon-svg{width:52px;height:52px;flex-shrink:0}
.week-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:10px}
.week-stat{background:rgba(255,255,255,0.06);border-radius:13px;padding:11px 13px}
.week-stat-lbl{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.4px}
.week-stat-val{font-size:17px;font-weight:600;margin-top:3px}
.week-stat-sub{font-size:11px;color:var(--text-dim)}

/* LAST UPDATED + REFRESH */
.last-upd{font-size:11px;color:var(--text-dim);display:flex;align-items:center;gap:6px;margin-top:3px}
.btn-refresh-sm{background:none;border:none;color:var(--text-dim);cursor:pointer;padding:0;line-height:1;transition:transform .3s}
.btn-refresh-sm:hover{color:var(--accent);transform:rotate(180deg)}

/* PULL TO REFRESH */
#ptr-indicator{position:fixed;top:-52px;left:50%;transform:translateX(-50%);width:44px;height:44px;border-radius:50%;background:rgba(20,35,50,0.92);backdrop-filter:blur(12px);border:1px solid var(--glass-border);display:flex;align-items:center;justify-content:center;font-size:20px;z-index:300;transition:top .25s ease,opacity .25s}
#ptr-indicator.visible{top:12px}
body.minimal .hide-in-minimal{display:none !important}
.minimal-hint{font-size:11px;color:var(--text-dim);margin-left:8px;opacity:0;transition:opacity .3s}
body.minimal .minimal-hint{opacity:1}

/* RESPONSIVE GRID - PC */
@media(min-width:900px){
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
  .two-col > .card{margin-bottom:0}
  .span-2{grid-column:1 / -1}
}

/* MOBILE */
@media(max-width:640px){
  #app{padding:16px 14px 48px}
  .main-card{padding:20px}
  .weather-icon-main{width:84px;height:84px}
  .temp-val{font-size:56px}
  .stats-row{grid-template-columns:repeat(2,1fr)}
  .search-box{flex-basis:100%}
  .btn-icon{width:44px;height:44px}
  .day-desc{display:none}
  .activities-grid{grid-template-columns:1fr 1fr}
}

/* LOADING */
#loading{position:fixed;inset:0;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,20,30,0.82);backdrop-filter:blur(10px);transition:opacity .4s}
#loading.hidden{opacity:0;pointer-events:none}
.loader-icon{font-size:52px;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.loader-text{margin-top:12px;font-size:13px;color:var(--text-dim)}
#error-msg{text-align:center;padding:16px;color:#ff8a65;font-size:13.5px;display:none}
</style>
</head>
<body>

<div id="ptr-indicator">↓</div>

<div id="bg"></div>
<div id="particles"></div>

<div id="loading">
  <div class="loader-icon">🌤️</div>
  <div class="loader-text">Se încarcă datele meteo…</div>
</div>

<div id="app">

  <div class="search-wrap">
    <div class="search-box">
      <input type="text" id="search-input" placeholder="Caută un oraș…" autocomplete="off" />
      <span class="search-icon">🔍</span>
      <div class="suggestions" id="suggestions"></div>
    </div>
    <button class="btn-icon" id="btn-gps" title="Locația mea">
      <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
    </button>
    <button class="btn-icon" id="btn-fav" title="Favorite">
      <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
    </button>
    <button class="btn-icon" id="btn-share" title="Exportă PNG">
      <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.59 13.51 15.42 17.49M15.41 6.51 8.59 10.49"/></svg>
    </button>
    <button class="btn-icon" id="btn-minimal" title="Mod Focus">
      <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg>
    </button>
  </div>

  <div id="quick-locations" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px"></div>
  <div id="error-msg"></div>

  <!-- ALERTS BAND -->
  <div id="alerts-band"></div>

  <!-- MAIN -->
  <div class="card main-card" id="main-card" style="display:none">
    <div class="location-row">
      <span>📍 <span id="country-name"></span></span>
      <span id="local-time" style="margin-left:auto;font-weight:500"></span>
      <span class="minimal-hint">Mod Focus</span>
    </div>
    <div class="last-upd" id="last-upd-row" style="display:none">
      <span id="last-upd-text"></span>
      <button class="btn-refresh-sm" title="Reîncarcă" onclick="refreshCurrent()">↻</button>
    </div>
    <div class="city-name" id="city-name">—</div>
    <div class="weather-desc" id="weather-desc">—</div>
    <div class="feel" id="feel-text"></div>

<script>

let favorites = JSON.parse(localStorage.getItem('weatherFavorites') || '[]');

function checkApiKey(){

  return true;
}

/* SEARCH */
let sugTimeout;
const searchInput = document.getElementById('search-input');
const sugBox = document.getElementById('suggestions');
searchInput.addEventListener('input', ()=>{
  clearTimeout(sugTimeout);
  const q = searchInput.value.trim();

  sugTimeout = setTimeout(()=>fetchSuggestions(q), 300);
});
searchInput.addEventListener('keydown', e=>{
  if(e.key==='Enter'){sugBox.classList.remove('open');const q=searchInput.value.trim();if(q) fetchByName(q)}
});
document.addEventListener('click', e=>{ if(!e.target.closest('.search-box')) sugBox.classList.remove('open') });

async function fetchSuggestions(q){
  try{
    const r = await fetch(`${GEO}/direct?q=${encodeURIComponent(q)}&limit=8&appid=${API_KEY}`);
    const data = await r.json();
    if(!Array.isArray(data)||!data.length){sugBox.classList.remove('open');return}
    sugBox.innerHTML = data.map(c=>`
      <div class="sug-item" data-lat="${c.lat}" data-lon="${c.lon}" data-name="${c.name}">
        <span>📍</span>
        <div><div>${c.name}</div><div style="font-size:11px;opacity:.6">${[c.state,c.country].filter(Boolean).join(', ')}</div></div>
      </div>`).join('');
    sugBox.classList.add('open');
    sugBox.querySelectorAll('.sug-item').forEach(el=>{
      el.addEventListener('click',()=>{
        searchInput.value=el.dataset.name; sugBox.classList.remove('open');
        fetchWeather(el.dataset.lat, el.dataset.lon);
      })
    });
  }catch(e){}
}
async function fetchByName(q){
  try{
    const r = await fetch(`${GEO}/direct?q=${encodeURIComponent(q)}&limit=1&appid=${API_KEY}`);
    const data = await r.json();
    if(!data.length){showError('Orașul nu a fost găsit.');return}

}

/* FETCH */
async function fetchWeather(lat, lon){
  if(!checkApiKey()) return;
  showLoading(true); hideError();
  try{
    const [cur, fore, aqi, onecall] = await Promise.all([
      fetch(`${BASE}/weather?lat=${lat}&lon=${lon}&appid=${API_KEY}&units=metric&lang=ro`).then(r=>r.json()),
      fetch(`${BASE}/forecast?lat=${lat}&lon=${lon}&appid=${API_KEY}&units=metric&lang=ro`).then(r=>r.json()),
      fetch(`${BASE}/air_pollution?lat=${lat}&lon=${lon}&appid=${API_KEY}`).then(r=>r.json()).catch(()=>null),
      fetch(`${BASE3}/onecall?lat=${lat}&lon=${lon}&appid=${API_KEY}&units=metric&lang=ro&exclude=minutely`).then(r=>r.json()).catch(()=>null),
    ]);
    if(cur.cod && cur.cod !== 200) throw new Error(cur.message||'Eroare API');
    currentWeatherData = {cur, fore, aqi, onecall, lat:+lat, lon:+lon};
    renderAll(cur, fore, aqi, onecall);
  }catch(e){ showError('Nu s-au putut obține datele: '+e.message) }
  finally{ showLoading(false) }
}

/* MOON PHASE */
function moonPhase(date){
  const known = new Date(2000,0,6,18,14,0); // new moon
  const synodic = 29.53058867;
  const diff = (date - known) / (1000*60*60*24);
  const phase = ((diff % synodic) + synodic) % synodic;
  return phase / synodic; // 0=new, 0.25=first quarter, 0.5=full, 0.75=last quarter
}
function renderMoonPhase(onecall){
  const card=document.getElementById('moon-card');
  if(!card) return;
  card.style.display='';
  const now=new Date();
  const p=moonPhase(now); // 0..1
  const illum=Math.round(p<=0.5 ? p*2*100 : (1-p)*2*100);
  const names=['Lună Nouă','Lună Crecătoare (semilună)','Primul Pătrar','Lună Gibosă Crecătoare','Lună Plină','Lună Gibosă Descrecătoare','Ultimul Pătrar','Lună Descrecătoare','Lună Nouă'];
  const idx=Math.round(p*8);
  const name=names[Math.min(idx,8)];
  // next full moon
  const daysToFull=p<0.5?(0.5-p)*29.53:((1.5-p)*29.53);
  document.getElementById('moon-phase-name').textContent=name;
  document.getElementById('moon-phase-pct').textContent=`Iluminare: ${illum}%`;
  document.getElementById('moon-phase-next').textContent=p<0.5?`Lună Plină în ${Math.round(daysToFull)} zile`:`Lună Nouă în ${Math.round((1-p)*29.53)} zile`;
  // SVG moon
  const svg=document.getElementById('moon-phase-svg');
  svg.innerHTML='';
  const ns='http://www.w3.org/2000/svg';
  const cx=26,cy=26,r=20;
  // background circle (dark)
  const bg=document.createElementNS(ns,'circle');
  bg.setAttribute('cx',cx);bg.setAttribute('cy',cy);bg.setAttribute('r',r);bg.setAttribute('fill','#1a2535');
  svg.appendChild(bg);
  // illuminated part using clip path approach
  const uid='mp'+Math.random().toString(36).slice(2,6);
  const defs=document.createElementNS(ns,'defs');
  const clip=document.createElementNS(ns,'clipPath'); clip.setAttribute('id',uid);
  const cr=document.createElementNS(ns,'circle'); cr.setAttribute('cx',cx);cr.setAttribute('cy',cy);cr.setAttribute('r',r); clip.appendChild(cr); defs.appendChild(clip); svg.appendChild(defs);
  // illuminated ellipse
  const g=document.createElementNS(ns,'g'); g.setAttribute('clip-path',`url(#${uid})`);
  const lit=document.createElementNS(ns,'ellipse');
  const waning=p>0.5;
  const phase=waning?p-0.5:p;
  const ex=p<0.5 ? cx+(r*(1-phase*4)) : cx-(r*(1-(p-0.5)*4));
  lit.setAttribute('cx',phase<0.25 ? cx+r*(0.5-phase*2) : cx-r*((phase-0.25)*2));
  lit.setAttribute('cy',cy);
  lit.setAttribute('rx',String(Math.abs(r*Math.cos(p*2*Math.PI))));
  lit.setAttribute('ry',String(r));
  lit.setAttribute('fill','#fff8e1');
  if(p<0.5){
    // waxing: right lit
    const rect=document.createElementNS(ns,'rect');rect.setAttribute('x',cx);rect.setAttribute('y',cy-r);rect.setAttribute('width',String(r));rect.setAttribute('height',String(r*2));rect.setAttribute('fill','#fff8e1');g.appendChild(rect);
    const el2=document.createElementNS(ns,'ellipse');el2.setAttribute('cx',cx);el2.setAttribute('cy',cy);el2.setAttribute('ry',String(r));
    const rx=Math.abs(r*Math.cos(p*2*Math.PI));
    el2.setAttribute('rx',String(rx));
    el2.setAttribute('fill',p<0.25?'#1a2535':'#fff8e1');
    g.appendChild(el2);
  } else {
    const rect=document.createElementNS(ns,'rect');rect.setAttribute('x',String(cx-r));rect.setAttribute('y',String(cy-r));rect.setAttribute('width',String(r));rect.setAttribute('height',String(r*2));rect.setAttribute('fill','#fff8e1');g.appendChild(rect);
    const el2=document.createElementNS(ns,'ellipse');el2.setAttribute('cx',cx);el2.setAttribute('cy',cy);el2.setAttribute('ry',String(r));
    const rx=Math.abs(r*Math.cos(p*2*Math.PI));
    el2.setAttribute('rx',String(rx));
    el2.setAttribute('fill',p<0.75?'#fff8e1':'#1a2535');
    g.appendChild(el2);
  }
  svg.appendChild(g);
  // glow
  const glow=document.createElementNS(ns,'circle');glow.setAttribute('cx',cx);glow.setAttribute('cy',cy);glow.setAttribute('r',String(r+4));glow.setAttribute('fill','none');glow.setAttribute('stroke','rgba(255,248,225,0.12)');glow.setAttribute('stroke-width','4');svg.appendChild(glow);
}

/* WEEKLY SUMMARY */
function renderWeeklySummary(fore, onecall){
  const card=document.getElementById('weekly-card');
  if(!card) return;
  card.style.display='';
  const days={};
  fore.list.forEach(h=>{
    const d=new Date(h.dt*1000).toLocaleDateString('ro-RO',{weekday:'short'});
    if(!days[d]) days[d]={min:Infinity,max:-Infinity,rain:0,pop:0,name:d};
    days[d].min=Math.min(days[d].min,h.main.temp_min);
    days[d].max=Math.max(days[d].max,h.main.temp_max);
    days[d].rain+=(h.rain?.['3h']||0);
    days[d].pop=Math.max(days[d].pop,h.pop||0);
  });
  const arr=Object.values(days).slice(0,6);
  const absMax=Math.max(...arr.map(d=>d.max));
  const absMin=Math.min(...arr.map(d=>d.min));
  const hottestDay=arr.reduce((a,b)=>b.max>a.max?b:a);
  const rainiestDay=arr.reduce((a,b)=>b.rain>a.rain?b:a);
  const highestPop=arr.reduce((a,b)=>b.pop>a.pop?b:a);
  document.getElementById('week-summary').innerHTML=`
    <div class="week-stat"><div class="week-stat-lbl">🔆 Cel mai cald</div><div class="week-stat-val">${Math.round(absMax)}°C</div><div class="week-stat-sub">${hottestDay.name}</div></div>
    <div class="week-stat"><div class="week-stat-lbl">❄️ Cel mai frig</div><div class="week-stat-val">${Math.round(absMin)}°C</div><div class="week-stat-sub">${arr.reduce((a,b)=>b.min<a.min?b:a).name}</div></div>
    <div class="week-stat"><div class="week-stat-lbl">🌧️ Cea mai ploioasă</div><div class="week-stat-val">${rainiestDay.rain>0?rainiestDay.rain.toFixed(1)+' mm':'0 mm'}</div><div class="week-stat-sub">${rainiestDay.name}</div></div>
    <div class="week-stat"><div class="week-stat-lbl">☔ Max. șanse ploaie</div><div class="week-stat-val">${Math.round(highestPop.pop*100)}%</div><div class="week-stat-sub">${highestPop.name}</div></div>`;
}

/* PULL-TO-REFRESH */
(function(){
  let startY=0, pulling=false, triggered=false;
  const el=document.getElementById('ptr-indicator');
  document.addEventListener('touchstart',e=>{if(window.scrollY<5){startY=e.touches[0].clientY;pulling=true;triggered=false;}},{passive:true});
  document.addEventListener('touchmove',e=>{
    if(!pulling) return;
    const dy=e.touches[0].clientY-startY;
    if(dy>60 && !triggered){
      triggered=true;
      if(el){el.classList.add('visible');el.textContent='↻';}
    }
  },{passive:true});
  document.addEventListener('touchend',()=>{
    if(triggered && el){
      el.textContent='⟳';
      setTimeout(()=>{el.classList.remove('visible');el.textContent='↓';},800);
      if(currentWeatherData) fetchWeather(currentWeatherData.lat,currentWeatherData.lon);
    }
    pulling=false;triggered=false;
  },{passive:true});
})();

function renderBackground(cur){
  const code=cur.weather[0].id;
  const isDay = cur.dt > cur.sys.sunrise && cur.dt < cur.sys.sunset;
  let cls = code>=200&&code<300?'storm': code>=300&&code<600?'rain': code>=600&&code<700?'snow': code>=700&&code<800?'fog': code===800?'clear':'clouds';
  document.body.className = `weather-${cls}-${isDay?'day':'night'}`;
  makeParticles(cls, isDay?'day':'night');
}
function makeParticles(cls, dn){
  const p=document.getElementById('particles'); p.innerHTML='';
  if(cls==='rain'||cls==='storm'){
    for(let i=0;i<45;i++){const d=document.createElement('div');d.style.cssText=`position:absolute;width:${Math.random()*1.5+0.5}px;height:${Math.random()*14+6}px;background:rgba(130,180,255,0.5);left:${Math.random()*100}%;top:-20px;border-radius:2px;animation:fall ${Math.random()*1.2+0.6}s linear infinite;animation-delay:-${Math.random()*3}s`;p.appendChild(d)}
    if(cls==='storm'){const fl=document.createElement('div');fl.style.cssText='position:absolute;inset:0;background:rgba(200,220,255,0.035);animation:lightning 4s infinite';p.appendChild(fl)}
  } else if(cls==='snow'){
    for(let i=0;i<36;i++){const s=Math.random()*4+2.5;const d=document.createElement('div');d.style.cssText=`position:absolute;width:${s}px;height:${s}px;background:rgba(255,255,255,0.85);border-radius:50%;left:${Math.random()*100}%;top:-20px;animation:flake ${Math.random()*4+3}s linear infinite;animation-delay:-${Math.random()*8}s`;p.appendChild(d)}
  } else if(dn==='night'&&cls==='clear'){
    for(let i=0;i<55;i++){const s=Math.random()*2+0.5;const d=document.createElement('div');d.style.cssText=`position:absolute;width:${s}px;height:${s}px;background:#fff;border-radius:50%;left:${Math.random()*100}%;top:${Math.random()*55}%;animation:twinkle ${Math.random()*3+2}s ease-in-out infinite;animation-delay:-${Math.random()*5}s`;p.appendChild(d)}
  } else if(cls==='fog'){
    for(let i=0;i<8;i++){
      const w=Math.random()*220+120; const h=Math.random()*14+8;
      const d=document.createElement('div');
      d.style.cssText=`position:absolute;width:${w}px;height:${h}px;background:rgba(180,200,215,0.18);border-radius:50px;left:${Math.random()*120-20}%;top:${10+i*10+Math.random()*8}%;animation:drift ${Math.random()*18+12}s linear infinite;animation-delay:-${Math.random()*20}s;filter:blur(4px)`;
      p.appendChild(d);
    }
  }
}

/* DEW POINT (formula Magnus) */
function dewPoint(t, rh){ const a=17.27,b=237.7,g=Math.log(rh/100)+(a*t/(b+t)); return +(b*g/(a-g)).toFixed(1); }
/* WIND CHILL / HEAT INDEX */
function apparentTemp(t, rh, wKmh){
  if(t<=10 && wKmh>=5) return +(13.12+0.6215*t-11.37*Math.pow(wKmh,0.16)+0.3965*t*Math.pow(wKmh,0.16)).toFixed(1);
  if(t>=27) return +(-8.7847+1.6114*t+2.3385*rh-0.1461*t*rh-0.01231*t*t-0.01642*rh*rh+0.002212*t*t*rh+0.0007255*t*rh*rh-0.000003583*t*t*rh*rh).toFixed(1);
  return null;
}

function renderMain(cur, onecall){
  document.getElementById('city-name').textContent = cur.name;
  document.getElementById('country-name').textContent = cur.sys.country;
  document.getElementById('temp-val').textContent = Math.round(cur.main.temp);
  document.getElementById('weather-desc').textContent = cur.weather[0].description;
  document.getElementById('feel-text').textContent = `Se simte ca ${Math.round(cur.main.feels_like)}°C`;
  updateTimeDisplay();

  // Last updated
  const now=new Date();
  lastUpdatedTime = now.toLocaleTimeString('ro-RO',{hour:'2-digit',minute:'2-digit'});
  updateLastUpd();

  const hum = cur.main.humidity;
  const vis = cur.visibility ? (cur.visibility/1000).toFixed(1)+' km' : 'N/A';

  // Pressure trend: compare current vs forecast +3h (meteorological standard)
  const pres = cur.main.pressure;
  let presTrend = '→';
  if(onecall?.hourly && onecall.hourly.length >= 3){
    const p3h = onecall.hourly[2]?.pressure;
    if(p3h){ const d=pres-p3h; presTrend = d>2?'↑':d<-2?'↓':'→'; }
  }
  lastPressure = pres;
  const presStr = `${pres} ${presTrend} hPa`;

  // Precipitation
  let rain1h = cur.rain?.['1h'] ?? cur.rain?.['3h'] ?? null;
  if(rain1h===null && onecall?.current?.rain) rain1h = onecall.current.rain['1h'] ?? null;
  const rainStr = rain1h!==null ? rain1h.toFixed(1)+' mm' : '0 mm';

  const sr = new Date((cur.sys.sunrise+cur.timezone)*1000).toLocaleTimeString('ro-RO',{hour:'2-digit',minute:'2-digit',timeZone:'UTC'});
  const ss = new Date((cur.sys.sunset+cur.timezone)*1000).toLocaleTimeString('ro-RO',{hour:'2-digit',minute:'2-digit',timeZone:'UTC'});

  const uvi = onecall?.current?.uvi ?? null;
  const uvHtml = uvi!==null ? `<div class="stat"><div class="stat-label">☀️ Indice UV</div><div class="stat-val">${uvi.toFixed(1)} <span class="stat-unit">${uvLabel(uvi)}</span></div><div class="uv-bar-wrap"><div class="uv-bar-dot" style="left:${Math.min(100,uvi/11*100)}%"></div></div></div>` : '';

  // Dew point
  const dp = dewPoint(cur.main.temp, hum);
  const dpLabel = dp<10?'Uscat':dp<16?'Confortabil':dp<20?'Umed':'Foarte umed';

  // Humidity bar
  const humColor = hum<40?'#81d4fa':hum<60?'#4fc3f7':hum<80?'#ffca28':'#ff7043';
  const humLabel = hum<40?'Uscat':hum<60?'Ideal':hum<80?'Umed':'Foarte umed';

  // Wind chill / heat index
  const wKmh = cur.wind.speed*3.6;
  const appT = apparentTemp(cur.main.temp, hum, wKmh);
  const appHtml = appT!==null ? `<div class="stat"><div class="stat-label">🌡️ ${cur.main.temp<=10?'Wind Chill':'Heat Index'}</div><div class="stat-val">${appT}°C</div></div>` : '';

  document.getElementById('stats-row').innerHTML =
    `<div class="stat"><div class="stat-label">💧 Umiditate</div><div class="stat-val">${hum}%</div><div class="hum-bar-wrap"><div class="hum-bar-fill" style="width:${hum}%;background:${humColor}"></div></div><div style="font-size:10px;color:var(--text-dim);margin-top:2px">${humLabel}</div></div>`+
    `<div class="stat"><div class="stat-label">💧 Punct rouă</div><div class="stat-val">${dp}°C</div><div style="font-size:10px;color:var(--text-dim);margin-top:1px">${dpLabel}</div></div>`+
    `<div class="stat"><div class="stat-label">👁️ Vizibilitate</div><div class="stat-val">${vis}</div></div>`+
    `<div class="stat"><div class="stat-label">🌡️ Presiune</div><div class="stat-val">${presStr}</div></div>`+
    `<div class="stat"><div class="stat-label">🌧️ Precipitații</div><div class="stat-val">${rainStr}</div></div>`+
    `<div class="stat"><div class="stat-label">🌅 Răsărit</div><div class="stat-val">${sr}</div></div>`+
    `<div class="stat"><div class="stat-label">🌇 Apus</div><div class="stat-val">${ss}</div></div>`+
    uvHtml + appHtml;

  drawWeatherIcon(document.getElementById('icon-main'), cur.weather[0].id, isDayTime(cur), 120);
}
function uvLabel(uv){ if(uv<3) return 'Scăzut'; if(uv<6) return 'Moderat'; if(uv<8) return 'Ridicat'; if(uv<11) return 'F. Ridicat'; return 'Extrem'; }
function isDayTime(cur){ return cur.dt > cur.sys.sunrise && cur.dt < cur.sys.sunset }

/* SUN ARC - FIXED & RESPONSIVE */
function renderSunArc(cur){
  const card=document.getElementById('sun-arc-card'); card.style.display='';
  const sr=cur.sys.sunrise, ss=cur.sys.sunset, now=cur.dt;
  const isDay = isDayTime(cur);
  const sunDot = document.getElementById('sun-dot');
  const sunGlow = document.getElementById('sun-glow');
  
  let t = (now - sr) / (ss - sr);
  t = Math.max(0, Math.min(1, t));
  
  // perfect semicircle: x = 50 + 45*cos(pi*(1-t)), y = 50 - 45*sin(pi*t)
  const angle = Math.PI * t;
  const cx = 50 + 45 * Math.cos(Math.PI - angle);
  const cy = 50 - 45 * Math.sin(angle);
  
  if(isDay){
    sunDot.setAttribute('cx', cx);
    sunDot.setAttribute('cy', cy);
    sunDot.setAttribute('fill', '#FFD54F');
    sunGlow.setAttribute('cx', cx);
    sunGlow.setAttribute('cy', cy);
    sunGlow.setAttribute('fill', 'rgba(255,213,79,0.18)');
    sunGlow.style.display = '';
  } else {
    // night: moon centered low
    sunDot.setAttribute('cx', 50);
    sunDot.setAttribute('cy', 22);
    sunDot.setAttribute('fill', '#FFF8E1');
    sunGlow.setAttribute('cx', 50);
    sunGlow.setAttribute('cy', 22);
    sunGlow.setAttribute('fill', 'rgba(255,248,225,0.10)');
    sunGlow.style.display = '';
  }

  document.getElementById('sunrise-time').textContent = '🌅 ' + new Date((sr+cur.timezone)*1000).toLocaleTimeString('ro-RO',{hour:'2-digit',minute:'2-digit',timeZone:'UTC'});
  document.getElementById('sunset-time').textContent = new Date((ss+cur.timezone)*1000).toLocaleTimeString('ro-RO',{hour:'2-digit',minute:'2-digit',timeZone:'UTC'}) + ' 🌇';
  
  const remaining = Math.round((ss-now)/60);
  let msg = isDay ? (remaining>0 ? `Soarele apune în ${Math.floor(remaining/60)}h ${remaining%60}m` : 'Soarele a apus') : 'Noapte';
  document.getElementById('sun-arc-now').textContent = msg;
}

/* ACTIVITIES */
function renderActivities(cur, fore){
  const card=document.getElementById('activities-card'); card.style.display='';
  const t = cur.main.temp;
  const wind = cur.wind.speed * 3.6;
  const rain = (fore.list.slice(0,2).reduce((a,h)=>a+(h.rain?.['3h']||0),0));
  const score = (min,max) => {
    let s = 100;
    if(t < min) s -= (min-t)*8;
    if(t > max) s -= (t-max)*8;
    s -= rain*25;
    s -= Math.max(0, wind-20)*2;
    return Math.max(0, Math.min(100, Math.round(s)));
  };
  const acts = [
    ['🏃 Alergare', score(8,22)],
    ['🚲 Bicicletă', score(12,26)],
    ['🐕 Plimbare', score(5,28)],
    ['🔥 Grătar', score(18,30)],
  ];
  document.getElementById('activities-grid').innerHTML = acts.map(([name, sc])=>{
    const cls = sc >= 70 ? 'score-good' : sc >= 45 ? 'score-mid' : 'score-bad';
    const label = sc >= 70 ? 'Bun' : sc >= 45 ? 'Ok' : 'Slab';
    return `<div class="activity"><div class="activity-name">${name}</div><div class="activity-score ${cls}">${label}</div></div>`
  }).join('');
}

function degToDir(d){const dirs=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];return dirs[Math.round(d/22.5)%16]}

/* 10 DAY */
function renderTenDay(fore){
  const days={};
  fore.list.forEach(h=>{
    const d=new Date(h.dt*1000).toLocaleDateString('ro-RO',{weekday:'short',day:'numeric',month:'short'});
    if(!days[d]) days[d]={min:Infinity,max:-Infinity,codes:[],rain:0,pop:0,desc:h.weather[0].description};
    days[d].min=Math.min(days[d].min,h.main.temp_min);
    days[d].max=Math.max(days[d].max,h.main.temp_max);
    days[d].rain+=(h.rain?.['3h']||0);
    days[d].pop=Math.max(days[d].pop, h.pop||0);
    days[d].codes.push(h.weather[0].id);
  });
  const arr=Object.entries(days).slice(0,6);
  // global min/max for proportional temp bar
  const allMin=Math.min(...arr.map(([,d])=>d.min));
  const allMax=Math.max(...arr.map(([,d])=>d.max));
  const range=allMax-allMin||1;
  document.getElementById('ten-day-rows').innerHTML = arr.map(([date,d],i)=>{
    const leftPct=((d.min-allMin)/range*80).toFixed(1);
    const widthPct=((d.max-d.min)/range*80).toFixed(1);
    const pop=Math.round(d.pop*100);
    return `<div class="day-row">
      <div class="day-name">${date}</div>
      <svg class="day-icon" id="tdicon-${i}" viewBox="0 0 28 28"></svg>
      <div class="day-desc">${d.desc}</div>
      <div class="day-rain">${d.rain>0?d.rain.toFixed(1)+'mm':pop>10?pop+'%':''}</div>
      <div class="day-temps">
        <span class="day-min">${Math.round(d.min)}°</span>
        <div class="temp-bar-wrap" style="flex:1;margin:0 6px;min-width:60px">
          <div class="temp-bar-track" style="position:relative;height:5px;border-radius:3px;background:linear-gradient(to right,#4fc3f7,#ffca28,#ff7043);overflow:hidden">
            <div style="position:absolute;inset:0;background:rgba(0,0,0,0.55);border-radius:3px"></div>
            <div style="position:absolute;top:0;bottom:0;left:${leftPct}%;width:${widthPct}%;background:transparent;box-shadow:inset 0 0 0 5px rgba(255,255,255,0);border-radius:3px;background:linear-gradient(to right,#4fc3f7,#ffca28,#ff7043)"></div>
          </div>
        </div>
        <span class="day-max">${Math.round(d.max)}°</span>
      </div>
    </div>`;
  }).join('');
  arr.forEach(([,d],i)=>{ const svg=document.getElementById(`tdicon-${i}`); if(svg) drawWeatherIcon(svg,mostCommon(d.codes),true,28); });
}
function mostCommon(arr){const f={};let m=0,v=arr[0];arr.forEach(x=>{f[x]=(f[x]||0)+1;if(f[x]>m){m=f[x];v=x}});return v}

/* ALERTS SYSTEM */
function renderAlerts(cur, fore, aqi, onecall){
  const band = document.getElementById('alerts-band');
  const alerts = []; // {severity:'severe'|'warn'|'info', icon, title, body}

  // 1. Official OWM alerts from One Call
  if(onecall?.alerts && onecall.alerts.length > 0){
    onecall.alerts.forEach(a=>{
      const ev = a.event || 'Alertă meteo';
      const desc = (a.description || '').split('\n').slice(0,2).join(' ').slice(0,140);
      // severity by event keywords
      const sev = /furtun|tornado|uragan|ciclon|extrem|roșu|red/i.test(ev) ? 'severe'
                : /atenționare|portocaliu|orange|avertizare/i.test(ev) ? 'warn' : 'warn';
      alerts.push({severity:sev, icon:'⚠️', title:ev, body:desc});
    });
  }

  const code = cur.weather[0].id;
  const temp = cur.main.temp;
  const feelsLike = cur.main.feels_like;
  const wind = cur.wind.speed * 3.6;
  const gust = (cur.wind.gust||cur.wind.speed) * 3.6;
  const vis = (cur.visibility||10000) / 1000;
  const uvi = onecall?.current?.uvi ?? null;
  const aqiVal = aqi?.list?.[0]?.main?.aqi ?? null;

  // 2. Caniculă
  if(temp >= 36 || feelsLike >= 38){
    alerts.push({severity:'severe', icon:'🌡️', title:'Caniculă extremă', body:`Temperatura de ${Math.round(temp)}°C (resimțită ${Math.round(feelsLike)}°C) este periculoasă. Hidratează-te și evită expunerea.`});
  } else if(temp >= 32 || feelsLike >= 35){
    alerts.push({severity:'warn', icon:'🌡️', title:'Căldură intensă', body:`${Math.round(temp)}°C (resimțit ${Math.round(feelsLike)}°C). Limitează activitățile fizice în exterior.`});
  }

  // 3. Ger
  if(temp <= -15 || feelsLike <= -20){
    alerts.push({severity:'severe', icon:'🥶', title:'Ger extrem', body:`${Math.round(temp)}°C (resimțit ${Math.round(feelsLike)}°C). Risc de degerături. Evită ieșirile prelungite.`});
  } else if(temp <= -5 || feelsLike <= -10){
    alerts.push({severity:'warn', icon:'🧊', title:'Temperaturi scăzute', body:`${Math.round(temp)}°C (resimțit ${Math.round(feelsLike)}°C). Îmbracă-te în straturi și protejează-ți extremitățile.`});
  } else if(temp <= 2 && temp > 0 && code >= 500 && code < 600){
    alerts.push({severity:'warn', icon:'🌧️', title:'Risc de polei', body:`Ploaie la temperaturi aproape de 0°C — posibil polei pe carosabil.`});
  }

  // 4. Furtună / ploaie torențială
  if(code >= 200 && code < 300){
    const heavy = code >= 212;
    alerts.push({severity:heavy?'severe':'warn', icon:'⛈️', title:heavy?'Furtună violentă':'Furtună cu descărcări electrice', body:'Evită spațiile deschise, copacii izolați și activitățile în exterior.'});
  } else if(code >= 500 && code < 600){
    // Use measured precipitation only — never trigger alert on 0mm
    const rain9h = fore.list.slice(0,3).reduce((a,h)=>a+(h.rain?.['3h']||0),0);
    const rain1hCur = cur.rain?.['1h'] ?? cur.rain?.['3h'] ?? null;
    const rain1hOC  = onecall?.hourly?.[0]?.rain?.['1h'] ?? null;
    const rain1h = rain1hOC ?? rain1hCur ?? (rain9h > 0 ? rain9h/9 : 0);
    if(rain1h >= 10){
      alerts.push({severity:'severe', icon:'🌊', title:'Ploaie torențială', body:`Intensitate ~${rain1h.toFixed(1)} mm/h. Risc de inundații locale.`});
    } else if(rain9h > 0.5 || rain1h > 0.1){
      const qty = rain9h > 0 ? `~${rain9h.toFixed(1)} mm` : `~${rain1h.toFixed(1)} mm/h`;
      alerts.push({severity:'info', icon:'☔', title:`Ia umbrela! ${qty} în următoarele ore`, body:''});
    }
  }

  // 5. Ninsoare / viscol
  if(code >= 600 && code < 700){
    const heavy = code === 602 || code === 622 || code === 621;
    if(heavy || wind > 30){
      alerts.push({severity:'severe', icon:'🌨️', title:'Viscol / ninsoare abundentă', body:'Evită deplasările. Pericol de acumulări de zăpadă și vizibilitate redusă.'});
    } else {
      alerts.push({severity:'warn', icon:'❄️', title:'Ninsoare', body:'Drum precaut. Adaptat viteza la condițiile de iarnă.'});
    }
  }

  // 6. Vânt puternic
  if(gust >= 90){
    alerts.push({severity:'severe', icon:'💨', title:`Vânt extrem — rafale ${Math.round(gust)} km/h`, body:'Risc de distrugeri materiale. Evită deplasările cu vehicule înalte.'});
  } else if(gust >= 60 || wind >= 50){
    alerts.push({severity:'warn', icon:'💨', title:`Vânt puternic — rafale ${Math.round(gust)} km/h`, body:'Atenție la obiecte nesigurate. Conducere defensivă.'});
  } else if(wind >= 35){
    alerts.push({severity:'info', icon:'🌬️', title:`Vânt moderat-tare — ${Math.round(wind)} km/h`, body:''});
  }

  // 7. Vizibilitate redusă (ceață)
  if(vis <= 0.2){
    alerts.push({severity:'severe', icon:'🌫️', title:'Ceață densă — vizibilitate sub 200m', body:'Evită conducerea. Dacă ești în trafic, folosește luminile de ceață.'});
  } else if(vis <= 1){
    alerts.push({severity:'warn', icon:'🌫️', title:`Ceață — vizibilitate ${(vis*1000).toFixed(0)}m`, body:'Reduceți viteza și mențineți distanța de siguranță.'});
  }

  // 8. UV Index
  if(uvi !== null){
    if(uvi >= 11){
      alerts.push({severity:'severe', icon:'☀️', title:`UV Extrem (${uvi.toFixed(1)})`, body:'Protecție maximă: stai la umbră între 10–16, SPF 50+, ochelari, pălărie.'});
    } else if(uvi >= 8){
      alerts.push({severity:'warn', icon:'☀️', title:`UV Foarte ridicat (${uvi.toFixed(1)})`, body:'Aplică cremă SPF 30+, limitează expunerea directă la soare.'});
    } else if(uvi >= 6){
      alerts.push({severity:'info', icon:'🕶️', title:`Indice UV ridicat (${uvi.toFixed(1)}) — folosiți protecție solară`, body:''});
    }
  }

  // 9. AQI
  if(aqiVal >= 5){
    alerts.push({severity:'severe', icon:'😷', title:'Calitate aer VERY POOR — evitați efortul afară', body:'Persoanele cu afecțiuni respiratorii sau cardiace să rămână în interior.'});
  } else if(aqiVal >= 4){
    alerts.push({severity:'warn', icon:'😷', title:'Calitate aer slabă', body:'Limitați activitățile fizice în exterior, în special cele de lungă durată.'});
  }

  // 10. Cer senin info
  if(alerts.length === 0 && code === 800 && temp > 15){
    alerts.push({severity:'info', icon:'😎', title:'Cer senin și condiții bune', body:'Zi perfectă pentru activități în aer liber!'});
  }

  // Render
  band.innerHTML = alerts.map(a=>`
    <div class="alert-item alert-${a.severity}">
      <div class="alert-icon">${a.icon}</div>
      <div class="alert-text"><b>${a.title}</b>${a.body?`<span>${a.body}</span>`:''}</div>
    </div>`).join('');

  // Hide the inline rain-alert — alerts band above already covers this
  const rainAlertEl = document.getElementById('rain-alert');
  if(rainAlertEl) rainAlertEl.style.display='none';
}


/* ICONS v2 - day/night */
function drawWeatherIcon(svg, code, isDay, size){
  svg.innerHTML=''; const s=size||40; svg.setAttribute('viewBox',`0 0 ${s} ${s}`);
  svg.style.overflow='visible';
  if(code===800){isDay?drawSun(svg,s):drawMoon(svg,s)}
  else if(code>=801&&code<=804){isDay?drawPartlyCloudy(svg,s,code):drawNightCloudy(svg,s,code)}
  else if(code>=200&&code<300){drawStorm(svg,s,isDay)}
  else if(code>=300&&code<600){code>=500?drawRain(svg,s,code>=502,isDay):drawDrizzle(svg,s,isDay)}
  else if(code>=600&&code<700){drawSnow(svg,s,isDay)}
  else if(code>=700&&code<800){drawFog(svg,s,isDay)}
  else {drawClouds(svg,s,isDay)}
}
function el(tag,attrs,parent){const e=document.createElementNS('http://www.w3.org/2000/svg',tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));if(parent)parent.appendChild(e);return e}
function uid(){return 'g'+Math.random().toString(36).slice(2,9)}

function drawSun(svg,s){
  const cx=s/2, cy=s/2, r=s*0.20;
  const id=uid();
  const defs=el('defs',{},svg);
  const rg=el('radialGradient',{id, cx:'50%',cy:'50%',r:'50%'},defs);
  el('stop',{'offset':'0%','stop-color':'#fff176'},rg);
  el('stop',{'offset':'100%','stop-color':'#ffb300'},rg);
  el('circle',{cx,cy,r:r+s*0.08,fill:`url(#${id})`,opacity:'0.22'},svg);
  el('circle',{cx,cy,r,fill:`url(#${id})`},svg);
  for(let i=0;i<12;i++){const a=i/12*Math.PI*2;
    el('line',{x1:cx+Math.cos(a)*(r+s*0.06),y1:cy+Math.sin(a)*(r+s*0.06),x2:cx+Math.cos(a)*(r+s*0.16),y2:cy+Math.sin(a)*(r+s*0.16),stroke:'#ffd54f','stroke-width':s*0.032,'stroke-linecap':'round',opacity:'0.9'},svg)
  }
}
function drawMoon(svg,s){
  const cx=s*0.52, cy=s*0.45, r=s*0.20;
  // glow
  el('circle',{cx,cy,r:r*1.35,fill:'#fff8e1',opacity:'0.08'},svg);
  // moon body
  el('circle',{cx,cy,r,fill:'#fff8e1'},svg);
  // craters
  el('circle',{cx:cx-r*0.3,cy:cy-r*0.2,r:r*0.22,fill:'#f0e6c8',opacity:'0.9'},svg);
  el('circle',{cx:cx+r*0.25,cy:cy+r*0.25,r:r*0.15,fill:'#f0e6c8',opacity:'0.9'},svg);
  // shadow for crescent look
  el('circle',{cx:cx+r*0.28,cy:cy-r*0.1,r:r*0.88,fill:'#0f1b2d',opacity:'0.22'},svg);
  // stars
  [[0.18,0.22],[0.78,0.25],[0.82,0.72],[0.22,0.78]].forEach(([x,y])=>{
    el('circle',{cx:s*x,cy:s*y,r:s*0.018,fill:'#fff',opacity:'0.85'},svg)
  });
}
function cloudPath(x,y,w,h){
  return `M${x+w*0.22} ${y+h} C${x} ${y+h} ${x} ${y+h*0.55} ${x+w*0.25} ${y+h*0.5} C${x+w*0.3} ${y+h*0.15} ${x+w*0.5} ${y+h*0.12} ${x+w*0.62} ${y+h*0.32} C${x+w*0.78} ${y+h*0.18} ${x+w*1.05} ${y+h*0.45} ${x+w*0.78} ${y+h} Z`
}
function drawCloud(svg,s,x,y,w,h,night){
  const col = night ? '#9aaec6' : '#e6f0fa';
  const shadow = night ? '#7a8fa8' : '#c2d6e8';
  el('path',{d:cloudPath(x,y+ s*0.025,w,h),fill:shadow,opacity:'0.55'},svg);
  el('path',{d:cloudPath(x,y,w,h),fill:col},svg);
}
function drawPartlyCloudy(svg,s,code){
  drawSun(svg,s*0.72);
  const cov = code===801?0.55:code===802?0.65:0.75;
  drawCloud(svg,s,s*0.18,s*0.38,s*cov,s*0.38,false);
}
function drawNightCloudy(svg,s,code){
  drawMoon(svg,s*0.78);
  const cov = code===801?0.55:0.7;
  drawCloud(svg,s,s*0.18,s*0.42,s*cov,s*0.36,true);
}
function drawClouds(svg,s,night){
  drawCloud(svg,s,s*0.08,s*0.22,s*0.52,s*0.32,night);
  drawCloud(svg,s,s*0.32,s*0.42,s*0.60,s*0.34,night);
}
function drawRain(svg,s,heavy,isDay){
  const night = !isDay;
  drawClouds(svg,s,night);
  const drops = heavy?5:3;
  for(let i=0;i<drops;i++){
    const x = s*(0.22 + i*0.55/drops);
    const y0 = s*0.68;
    el('line',{x1:x,y1:y0,x2:x-s*0.028,y2:y0+s*0.16,stroke:'#5ab8ff','stroke-width':s*0.032,'stroke-linecap':'round',opacity:'0.95'},svg);
  }
}
function drawDrizzle(svg,s,isDay){
  drawCloud(svg,s,s*0.15,s*0.22,s*0.70,s*0.36,!isDay);
  for(let i=0;i<4;i++){
    el('circle',{cx:s*(0.28+i*0.16),cy:s*(0.72+(i%2)*0.07),r:s*0.022,fill:'#7dc8ff',opacity:'0.95'},svg);
  }
}
function drawStorm(svg,s,isDay){
  drawCloud(svg,s,s*0.12,s*0.18,s*0.76,s*0.38,true);
  // lightning
  el('polygon',{points:`${s*0.52} ${s*0.52} ${s*0.40} ${s*0.70} ${s*0.50} ${s*0.70} ${s*0.38} ${s*0.90} ${s*0.60} ${s*0.68} ${s*0.50} ${s*0.68}`,fill:'#ffd54f',opacity:'0.98'},svg);
}
function drawSnow(svg,s,isDay){
  const night = !isDay;
  drawCloud(svg,s,s*0.15,s*0.20,s*0.70,s*0.34,night);
  const flakes=[[0.28,0.70],[0.48,0.78],[0.68,0.72],[0.42,0.90],[0.62,0.88]];
  flakes.forEach(([x,y])=>{
    const cx=s*x, cy=s*y, r=s*0.025;
    el('circle',{cx,cy,r,fill:'#eaf6ff'},svg);
    el('line',{x1:cx-r*1.7,y1:cy,x2:cx+r*1.7,y2:cy,stroke:'#eaf6ff','stroke-width':s*0.012},svg);
    el('line',{x1:cx,y1:cy-r*1.7,x2:cx,y2:cy+r*1.7,stroke:'#eaf6ff','stroke-width':s*0.012},svg);
  });
}
function drawFog(svg,s,isDay){
  const col = isDay ? 'rgba(210,220,230,0.9)' : 'rgba(160,175,190,0.8)';
  for(let i=0;i<4;i++){
    const y = s*(0.30+i*0.14);
    el('path',{d:`M${s*0.15} ${y} C${s*0.35} ${y-s*0.025} ${s*0.55} ${y+s*0.025} ${s*0.85} ${y}`,fill:'none',stroke:col,'stroke-width':s*0.038,'stroke-linecap':'round'},svg);
  }
}


/* UTILS */
function showAll(){
  document.querySelectorAll('.card').forEach(c=>{
    // keep rain6h hidden if chart hasn't been built yet
    if(c.id==='rain6h-card') return;
    c.style.display='';
  });
}
function showLoading(on){document.getElementById('loading').classList.toggle('hidden',!on)}
function showError(msg){const e=document.getElementById('error-msg');e.textContent=msg;e.style.display='block'}
function hideError(){document.getElementById('error-msg').style.display='none'}
let toastTimer=null;
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2400)}

/* FAVORITES */
function isFavorite(lat, lon){return favorites.some(f=>Math.abs(f.lat-lat)<0.01 && Math.abs(f.lon-lon)<0.01)}
function updateFavButton(){const btn=document.getElementById('btn-fav');if(!btn||!currentWeatherData) return;btn.classList.toggle('active', isFavorite(currentWeatherData.lat, currentWeatherData.lon))}
function toggleFavorite(){
  if(!currentWeatherData) return;
  const {cur,lat,lon}=currentWeatherData; const label=cur.name;
  if(isFavorite(lat,lon)){favorites=favorites.filter(f=>!(Math.abs(f.lat-lat)<0.01 && Math.abs(f.lon-lon)<0.01)); showToast(`${label} eliminat din favorite`)}
  else {favorites.push({label,lat,lon}); showToast(`${label} salvat la favorite`)}
  localStorage.setItem('weatherFavorites', JSON.stringify(favorites));
  renderQuickLocations(); updateFavButton();
}

/* SHARE / EXPORT PNG */
async function shareWeather(){
  if(!currentWeatherData) return;
  const btn=document.getElementById('btn-share');
  const card=document.getElementById('main-card');
  try{
    const canvas = await html2canvas(card, {backgroundColor:null, scale:2, useCORS:true});
    canvas.toBlob(async (blob)=>{
      const file = new File([blob], `vreme-${currentWeatherData.cur.name}.png`, {type:'image/png'});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        try{ await navigator.share({files:[file], title:`Vremea în ${currentWeatherData.cur.name}`}); return }catch(e){}
      }
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a'); a.href=url; a.download=file.name; a.click();
      URL.revokeObjectURL(url);
      btn.classList.add('copied'); showToast('Card salvat ca PNG');
      setTimeout(()=>btn.classList.remove('copied'),1500);
    }, 'image/png');
  }catch(e){
    const text=`Vremea în ${currentWeatherData.cur.name}: ${Math.round(currentWeatherData.cur.main.temp)}°C, ${currentWeatherData.cur.weather[0].description}`;
    navigator.clipboard?.writeText(text); showToast('Copiat în clipboard');
  }
}

/* MINIMAL MODE */
document.getElementById('btn-minimal').addEventListener('click', ()=>{
  document.body.classList.toggle('minimal');
  const on = document.body.classList.contains('minimal');
  document.getElementById('btn-minimal').classList.toggle('active', on);
  showToast(on ? 'Mod Focus activ' : 'Mod complet');
});

/* QUICK LOCATIONS */
function renderQuickLocations(){
  const wrap=document.getElementById('quick-locations'); if(!wrap) return;
  const all=[...QUICK_LOCATIONS, ...favorites];
  wrap.innerHTML = all.map((loc,i)=>`<button class="btn-quick" onclick="selectQuickLoc(${i})">📍 ${loc.label}${i>=QUICK_LOCATIONS.length?' ★':''}</button>`).join('');
}
function selectQuickLoc(i){
  const all=[...QUICK_LOCATIONS, ...favorites]; const loc=all[i]; if(!loc) return;
  document.querySelectorAll('.btn-quick').forEach((b,j)=>b.classList.toggle('active',j===i));
  searchInput.value=loc.label;
  fetchWeather(loc.lat, loc.lon);
}
window.selectQuickLoc = selectQuickLoc;

/* INIT */
window.addEventListener('DOMContentLoaded',()=>{
  if(!checkApiKey()) return;
  document.getElementById('btn-fav').addEventListener('click', toggleFavorite);
  document.getElementById('btn-share').addEventListener('click', shareWeather);
  renderQuickLocations();
  fetchWeather(QUICK_LOCATIONS[0].lat, QUICK_LOCATIONS[0].lon);
});
</script>
